name: Generar índice semántico aislado una vez

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generar-indice-semantico-aislado-temporal.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout Worker generador temporal
        uses: actions/checkout@v4
        with:
          ref: mls-semantic-batch-endpoint-temp
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Desplegar Worker aislado con clave efímera
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          GEN_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$GEN_KEY"
          export MLS_EMBEDDING_KEY="$GEN_KEY"
          export MLS_EMBEDDING_ENDPOINT="https://mls-semantic-generator-temp.dpidiaz.workers.dev/embed"
          echo "MLS_EMBEDDING_KEY=$GEN_KEY" >> "$GITHUB_ENV"
          echo "MLS_EMBEDDING_ENDPOINT=$MLS_EMBEDDING_ENDPOINT" >> "$GITHUB_ENV"

          KEY_B64=$(printf '%s' "$GEN_KEY" | base64 -w0)
          node - "$KEY_B64" <<'NODE'
          const fs=require('node:fs');
          const key=Buffer.from(process.argv[2],'base64').toString('utf8');
          const file='scripts/semantic batch worker temp.js';
          let source=fs.readFileSync(file,'utf8');
          const marker='__SEMANTIC_GENERATION_KEY__';
          if(!source.includes(marker))throw new Error('No se encontró placeholder de clave temporal.');
          source=source.replaceAll(marker,key);
          fs.writeFileSync(file,source);
          NODE

          npx wrangler deploy --config wrangler.semantic-batch-temp.jsonc

          status="000"
          curl_status=1
          for i in $(seq 1 20); do
            set +e
            status=$(curl --silent --show-error \
              --output /tmp/preflight.json \
              --write-out '%{http_code}' \
              -X POST "$MLS_EMBEDDING_ENDPOINT" \
              -H "authorization: Bearer $GEN_KEY" \
              -H 'content-type: application/json' \
              --data '{"texts":["preflight semántico MLS","segundo preflight"]}')
            curl_status=$?
            set -e
            if [ "$curl_status" -eq 0 ] && [ "$status" = "200" ]; then
              break
            fi
            echo "Preflight intento $i/20: curl=$curl_status HTTP=$status"
            cat /tmp/preflight.json 2>/dev/null || true
            sleep 3
          done

          cat /tmp/preflight.json 2>/dev/null || true
          if [ "$curl_status" -ne 0 ] || [ "$status" != "200" ]; then
            echo "::error::Worker semántico aislado no quedó disponible tras 20 intentos (curl=$curl_status HTTP=$status)"
            exit 1
          fi

          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('/tmp/preflight.json','utf8'));
          if(!p.ok||p.model!=='@cf/baai/bge-m3'||p.count!==2||p.dimensions!==1024)throw new Error('Preflight semántico aislado inválido.');
          if(!Array.isArray(p.vectors)||p.vectors.length!==2||!p.vectors.every(v=>Array.isArray(v)&&v.length===1024))throw new Error('Vectores de preflight inválidos.');
          console.log('SEMANTIC_ISOLATED_PREFLIGHT_OK');
          NODE

      - name: Checkout rama de generación
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fd
          git fetch origin mls-semantic-index-generation
          git checkout -B mls-semantic-index-generation origin/mls-semantic-index-generation
          git config user.name "MLS Semantic Index Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Generar idiomas faltantes con checkpoints
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MLS_SEMANTIC_BATCH_SIZE: "32"
        shell: bash
        run: |
          set -euo pipefail
          languages=(
            ingles
            portugues
            italiano
            frances
            aleman
            japones
            chino-taiwan
            coreano
            ruso
            espanol-guatemala
          )

          for lang in "${languages[@]}"; do
            echo "===== SEMANTIC START $lang ====="
            node "scripts/generar indice semantico.js" --language "$lang"

            git add "semantic/$lang.json" "semantic/$lang.bin"
            if ! git diff --cached --quiet; then
              git commit -m "Generate semantic index for $lang"
              git push origin HEAD:mls-semantic-index-generation
            else
              echo "$lang ya estaba actualizado; se conserva checkpoint."
            fi
            echo "===== SEMANTIC DONE $lang ====="
          done

      - name: Construir manifest y validar índice completo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {buildManifest}=require('./scripts/generar indice semantico.js');
          const {validateSemanticSource}=require('./scripts/publicar indice semantico.js');
          const manifest=buildManifest();
          if(!manifest)throw new Error('Manifest semántico incompleto.');
          const result=validateSemanticSource();
          if(!result.complete)throw new Error('Validación incompleta: '+JSON.stringify(result));
          if(result.totalEntries!==10133)throw new Error('Entradas inesperadas: '+result.totalEntries);
          console.log('SEMANTIC_COMPLETE '+JSON.stringify({
            totalEntries:result.totalEntries,
            totalChunks:result.totalChunks,
            totalBytes:result.totalBytes,
            model:manifest.model,
            corpusBuildId:manifest.corpusBuildId
          }));
          NODE

          git add semantic/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Complete MLS semantic index manifest"
            git push origin HEAD:mls-semantic-index-generation
          fi

      - name: Resumen
        if: always()
        shell: bash
        run: |
          set +e
          git fetch origin mls-semantic-index-generation
          git log --oneline -18 origin/mls-semantic-index-generation
          du -sh semantic 2>/dev/null || true

      - name: Neutralizar Worker temporal aislado
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set +e
          cat > /tmp/semantic-tombstone.mjs <<'EOF'
          export default {
            async fetch() {
              return new Response('Not found', { status: 404, headers: { 'cache-control': 'no-store' } });
            }
          };
          EOF
          cat > /tmp/wrangler-semantic-tombstone.jsonc <<'EOF'
          {
            "name": "mls-semantic-generator-temp",
            "main": "/tmp/semantic-tombstone.mjs",
            "compatibility_date": "2026-09-20",
            "workers_dev": true
          }
          EOF
          npx wrangler deploy --config /tmp/wrangler-semantic-tombstone.jsonc
          cleanup_status=$?
          if [ "$cleanup_status" -ne 0 ]; then
            echo "::warning::No se pudo neutralizar el Worker temporal; la clave efímera del run se perderá igualmente."
          else
            echo "Worker temporal neutralizado con 404."
          fi
          exit 0
