name: Inspect Bergamot registry hooks once

on:
  push:
    branches:
      - feature/translator-pronunciation-offline
    paths:
      - ".github/workflows/inspect-bergamot-registry-hooks-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect translator registry code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bergamot-inspect
          cd /tmp/bergamot-inspect
          npm pack @browsermt/bergamot-translator@0.4.9 >/dev/null
          tar -xzf browsermt-bergamot-translator-0.4.9.tgz
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/bergamot-inspect/package/translator.js','utf8');
          for(const term of ['registryUrl','findModels','models.json','baseUrl','fetchRegistry']){
            let i=0,count=0;
            while((i=s.indexOf(term,i))>=0 && count<6){
              console.log('\n--- '+term+' @ '+i+' ---\n');
              console.log(s.slice(Math.max(0,i-2200),Math.min(s.length,i+6500)));
              i+=term.length;
              count++;
            }
          }
          NODE
