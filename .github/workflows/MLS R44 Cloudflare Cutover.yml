name: MLS R44 Cloudflare Cutover

on:
  pull_request:
    paths:
      - '**/*r44*'
      - '**/*R44*'
      - 'MLS R32 EDITORIAL/r44/**'
  push:
    branches: [main]
    paths:
      - 'MLS R32 EDITORIAL/r44/CUTOVER_REQUEST.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mls-r44-cloudflare-cutover
  cancel-in-progress: false

jobs:
  verify-deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate R44 contracts
        run: |
          node 'scripts/r44 full pending corpus.cjs'
          node --test 'test/r44 cloudflare control plane.test.cjs' 'test/r44 full pending corpus.test.cjs'
          node 'scripts/validar corpus canonico.js'
          node --test 'test/canonical corpus.test.cjs' 'test/canonical runtime.test.cjs' 'test/canonical legacy removal.test.cjs' 'test/bundle sanitation.test.cjs' 'test/full text search.test.cjs'
      - name: Build production worker
        env:
          MLS_DERIVED_STALE_POLICY: degrade
        run: |
          npm run predeploy
          node --check src/index.js
          npm run check
      - name: Deploy R44 to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Bootstrap D1 and verify R44
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'
          status="$(curl -fsSL --retry 5 --retry-delay 3 "$base/api/r44/status")"
          printf '%s\n' "$status"
          printf '%s' "$status" | grep -F '"status":"ACTIVE"'
          printf '%s' "$status" | grep -F '"controlPlane":"CLOUDFLARE_D1"'
          printf '%s' "$status" | node 'scripts/r44 verify status.cjs'
          curl -fsSL "$base/r44-worker" | grep -F 'MLS R44 Cloudflare Worker'
          discover="$(curl -fsSL -X POST "$base/mcp" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            --data '{"jsonrpc":"2.0","id":"discover","method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"r44-ci","version":"1"},"io.modelcontextprotocol/clientCapabilities":{}}}}')"
          printf '%s\n' "$discover"
          printf '%s' "$discover" | grep -F '"supportedVersions":["2026-07-28","2025-11-25"]'
          tools="$(curl -fsSL -X POST "$base/mcp" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: tools/list' \
            --data '{"jsonrpc":"2.0","id":"tools","method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"r44-ci","version":"1"},"io.modelcontextprotocol/clientCapabilities":{}}}}')"
          printf '%s' "$tools" | grep -F '"name":"r44_claim"'
          printf '%s' "$tools" | grep -F '"name":"r44_submit"'
          echo 'R44_CLOUDFLARE_CUTOVER_OK'
