name: MLS R44 Cloudflare Cutover

on:
  pull_request:
    paths:
      - '**/*r44*'
      - '**/*R44*'
      - 'MLS R32 EDITORIAL/r44/**'
      - 'MLS R32 EDITORIAL/evidence git/registry/sources/**'
  push:
    branches: [main]
    paths:
      - 'MLS R32 EDITORIAL/r44/CUTOVER_REQUEST.json'
      - 'scripts/r44 canonical runtime.js'
      - 'scripts/r44 runtime.js'
      - 'scripts/unified r33 quarantine repair runtime.js'
      - 'scripts/unified runner r33 runtime.js'
      - 'public/runner.html'
      - 'MLS R32 EDITORIAL/evidence git/registry/sources/**'
      - '.github/workflows/MLS R44 Cloudflare Cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mls-r44-cloudflare-cutover
  cancel-in-progress: false

jobs:
  verify-deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate R44 contracts
        run: |
          node 'scripts/r44 full pending corpus.cjs'
          npm run test:r44
          node --test 'test/integration/r44-d1.test.cjs'
          node 'scripts/validar corpus canonico.js'
          node --test 'test/canonical corpus.test.cjs' 'test/canonical runtime.test.cjs' 'test/canonical legacy removal.test.cjs' 'test/bundle sanitation.test.cjs' 'test/full text search.test.cjs'
      - name: Validate Unified status monitor
        run: node --test 'test/pagina status.test.cjs' 'test/unified status monitor.test.cjs'
      - name: Build production worker
        env:
          MLS_DERIVED_STALE_POLICY: degrade
        run: |
          npm run predeploy
          node --check src/index.js
          npm run check
      - name: Check Cloudflare Access capability
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node 'scripts/configurar unified access.cjs' --check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Configure MLS Unified Cloudflare Access
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node 'scripts/configurar unified access.cjs'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy R44 to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify MLS Unified Access protection
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'
          check_protected() {
            local path="$1"
            local method="${2:-GET}"
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X "$method" "$base$path")"
            case "$code" in
              302|303|401|403) ;;
              *) echo "Access not enforced for $path (HTTP $code)" >&2; exit 1 ;;
            esac
          }
          check_protected '/runner.html' GET
          check_protected '/api/unified-runner/browser/status' POST
          echo 'MLS_UNIFIED_ACCESS_PROTECTED'
          machine_code="$(curl -sS -o "$RUNNER_TEMP/unified-machine-status.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $MLS_EDITORIAL_CHAT_KEY" \
            -H 'Content-Type: application/json' \
            --data '{}' "$base/api/unified-runner/status")"
          test "$machine_code" = "200"
          grep -q '"ok":true' "$RUNNER_TEMP/unified-machine-status.json"
          echo 'MLS_UNIFIED_MACHINE_BEARER_OK'

      - name: Bootstrap D1 and verify R44
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'
          status="$(curl -fsSL --retry 5 --retry-delay 3 "$base/api/r44/status")"
          printf '%s\n' "$status"
          printf '%s' "$status" | grep -F '"status":"ACTIVE"'
          printf '%s' "$status" | grep -F '"controlPlane":"CLOUDFLARE_D1"'
          printf '%s' "$status" | node 'scripts/r44 verify status.cjs'
          curl -fsSL "$base/r44-worker" | grep -F 'MLS R44 Cloudflare Worker'
          discover="$(curl -fsSL -X POST "$base/mcp" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            --data '{"jsonrpc":"2.0","id":"discover","method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"r44-ci","version":"1"},"io.modelcontextprotocol/clientCapabilities":{}}}}')"
          printf '%s\n' "$discover"
          printf '%s' "$discover" | grep -F '"supportedVersions":["2026-07-28","2025-11-25"]'
          tools="$(curl -fsSL -X POST "$base/mcp" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: tools/list' \
            --data '{"jsonrpc":"2.0","id":"tools","method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"r44-ci","version":"1"},"io.modelcontextprotocol/clientCapabilities":{}}}}')"
          printf '%s' "$tools" | grep -F '"name":"r44_claim"'
          printf '%s' "$tools" | grep -F '"name":"r44_submit"'
          printf '%s' "$tools" | grep -F '"name":"r44_checkpoint"'
          printf '%s' "$tools" | grep -F '"name":"r44_rebind"'
          printf '%s' "$tools" | grep -F '"name":"r44_reconcile"'
          bridge_status="$(curl -fsSL -X POST "$base/api/r44/chat-bridge/status" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $MLS_EDITORIAL_CHAT_KEY" \
            --data '{}')"
          printf '%s\n' "$bridge_status"
          printf '%s' "$bridge_status" | grep -F '"transport":"GITHUB_ACTIONS_FREE_BRIDGE"'
          printf '%s' "$bridge_status" | grep -F '"authenticated":true'
          echo 'R44_CLOUDFLARE_CUTOVER_OK'

      - name: Reconcile legacy R44 quarantine
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
          MLS_UNIFIED_BASE_URL: https://llmchatmls.dpidiaz.workers.dev
          R44_LEGACY_RECONCILE_BATCH: 5
          R44_LEGACY_RECONCILE_MAX_BATCHES: 60
          R44_LEGACY_RECONCILE_ENFORCE_D1_FREE_GUARD: '0'
        run: node 'scripts/r44 legacy quarantine reconcile.cjs'

      - name: Verify Unified status monitor in production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'
          json="$RUNNER_TEMP/unified-status.json"
          html="$RUNNER_TEMP/status.html"
          curl -fsSL --retry 5 --retry-delay 2 "$base/api/unified/status" -o "$json"
          curl -fsSL --retry 5 --retry-delay 2 "$base/status" -o "$html"
          node - "$json" <<'NODE'
          const fs=require('node:fs');
          const live=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const canonical=JSON.parse(fs.readFileSync('MLS R32 EDITORIAL/evidence git/indexes/verified.json','utf8'));
          if(live.ok!==true)throw Error('LIVE_UNIFIED_STATUS_NOT_OK');
          if(live.sourceOfTruth!=='github-main-verified-index')throw Error('LIVE_UNIFIED_SOURCE_INVALID');
          if(live.verifiedCount!==canonical.length)throw Error('LIVE_UNIFIED_COUNT_MISMATCH '+live.verifiedCount+' != '+canonical.length);
          if(live.totalEntries!==10133)throw Error('LIVE_UNIFIED_TOTAL_INVALID');
          if(live.remaining!==10133-canonical.length)throw Error('LIVE_UNIFIED_REMAINING_INVALID');
          console.log(JSON.stringify({ok:true,verifiedCount:live.verifiedCount,remaining:live.remaining,percent:live.percent}));
          NODE
          grep -F 'MLS Unified' "$html"
          grep -F '/api/unified/status' "$html"
          grep -F 'entradas canónicas VERIFIED' "$html"
          grep -F 'Desde que abriste el monitor' "$html"
          grep -F 'verified.json' "$html"
          echo 'MLS_UNIFIED_STATUS_MONITOR_OK'

