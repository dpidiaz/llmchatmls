name: Desplegar MLS en produccion (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:chat-editorial
      - run: npm run test:evidence
      - run: npm run test:canonical-tools
      - run: npm run qa:baseline
      - run: npm run predeploy
      - run: npm run recovery:verify
      - run: node --test test/deploy-contract.test.cjs
      - run: npm run check
      - name: Desplegar en produccion
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verificar Evidence visible en produccion
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'
          evidence="$(curl -fsSL --retry 3 --retry-delay 2 "$base/api/wiki/evidence-public/MLS-V10-0093")"
          asset="$(curl -fsSL --retry 3 --retry-delay 2 "$base/data/evidence/by-code/MLS-V10-0093.json")"
          printf '%s\n' "$evidence"
          printf '%s\n' "$asset"
          printf '%s' "$evidence" | grep -F '"status":"VERIFIED"'
          printf '%s' "$evidence" | grep -F '"sourceOfTruth":"github"'
          printf '%s' "$asset" | grep -F '"status": "VERIFIED"'
          printf '%s' "$asset" | grep -F '"sourceOfTruth": "github"'
          printf '%s' "$asset" | grep -F '"references"'
          printf '%s' "$asset" | grep -F 'Real Academia Española'
          reader="$RUNNER_TEMP/mls-reader.js"
          curl -fsSL --retry 3 --retry-delay 2 "$base/js/reader.js" -o "$reader"
          grep -F '/data/evidence/by-code/' "$reader"
          grep -F 'Referencias' "$reader"
          grep -F 'Formato APA 7' "$reader"
          grep -F 'Abrir fuente' "$reader"
          echo 'LIVE_EVIDENCE_READER_OK'

      - name: Sincronizar credenciales D1 Analytics
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          if [ -n "$D1_ANALYTICS_TOKEN" ] && [ -n "$D1_ANALYTICS_ACCOUNT_ID" ]; then
            printf '%s' "$D1_ANALYTICS_TOKEN" | npx wrangler secret put D1_ANALYTICS_TOKEN
            printf '%s' "$D1_ANALYTICS_ACCOUNT_ID" | npx wrangler secret put D1_ANALYTICS_ACCOUNT_ID
            echo 'Credenciales D1 Analytics de solo lectura sincronizadas.'
          else
            echo '::warning::D1 Analytics no está configurado: /status mantendrá el countdown pero el consumo oficial aparecerá como no disponible.'
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ANALYTICS_TOKEN: ${{ secrets.D1_ANALYTICS_TOKEN }}
          D1_ANALYTICS_ACCOUNT_ID: ${{ secrets.D1_ANALYTICS_ACCOUNT_ID }}
