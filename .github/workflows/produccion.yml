name: Desplegar MLS en produccion

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'MLS R32 EDITORIAL/evidence git/indexes/verified.json'
      - 'scripts/generar evidence runtime github.js'
      - 'MLS R32 OVERLAY/reader.js'
      - 'scripts/habilitar enlaces canonicos lector.js'
      - 'test/reader canonical links.test.cjs'
      - 'test/evidence github runtime.test.cjs'
      - '.github/workflows/produccion.yml'

concurrency:
  group: mls-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Certificar Evidence publicada
        if: ${{ github.event_name == 'push' }}
        run: node --test 'test/evidence github runtime.test.cjs' 'test/evidence native reader.test.cjs' 'test/disaster recovery.test.cjs' 'test/reader canonical links.test.cjs'
        env:
          MLS_DERIVED_STALE_POLICY: degrade

      - run: node --test 'test/r44 cloudflare control plane.test.cjs'
        if: ${{ github.event_name == 'workflow_dispatch' }}
      - run: npm run test:chat-editorial
        if: ${{ github.event_name == 'workflow_dispatch' }}
      - run: npm run test:evidence
        if: ${{ github.event_name == 'workflow_dispatch' }}
      - run: npm run test:canonical-tools
        if: ${{ github.event_name == 'workflow_dispatch' }}
      - run: npm run qa:baseline
        if: ${{ github.event_name == 'workflow_dispatch' }}

      - run: npm run predeploy
        env:
          MLS_DERIVED_STALE_POLICY: degrade
      - run: npm run recovery:verify
        env:
          MLS_DERIVED_STALE_POLICY: degrade
      - run: node --test test/deploy-contract.test.cjs
      - run: npm run check

      - name: Desplegar artefacto certificado en produccion
        if: ${{ github.ref == 'refs/heads/main' }}
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verificar Evidence visible en produccion
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'

          check_evidence() {
            code="$1"
            expected="$2"
            evidence="$(curl -fsSL --retry 3 --retry-delay 2 "$base/api/wiki/evidence-public/$code")"
            asset="$(curl -fsSL --retry 3 --retry-delay 2 "$base/data/evidence/by-code/$code.json")"
            printf '%s\n' "$evidence"
            printf '%s\n' "$asset"
            printf '%s' "$evidence" | grep -F '"status":"VERIFIED"'
            printf '%s' "$evidence" | grep -F '"sourceOfTruth":"github"'
            printf '%s' "$asset" | grep -F '"status": "VERIFIED"'
            printf '%s' "$asset" | grep -F '"sourceOfTruth": "github"'
            printf '%s' "$asset" | grep -F '"references"'
            printf '%s' "$asset" | grep -E "$expected"
          }

          check_evidence 'MLS-V10-0027' 'Real Academia Española|Ortografía'
          check_evidence 'MLS-V01-0001' 'Huddleston|Pullum|Cambridge University Press'

          reader="$RUNNER_TEMP/mls-reader.js"
          curl -fsSL --retry 3 --retry-delay 2 "$base/js/reader.js" -o "$reader"
          grep -F '/data/evidence/by-code/' "$reader"
          grep -F 'Referencias' "$reader"
          grep -F 'Formato APA 7' "$reader"
          grep -F 'Abrir fuente' "$reader"
          echo 'LIVE_EVIDENCE_READER_OK'

      - name: Verificar R44 Cloudflare control plane
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'
          status="$(curl -fsSL --retry 3 --retry-delay 2 "$base/api/r44/status")"
          printf '%s\n' "$status"
          printf '%s' "$status" | grep -F '"status":"ACTIVE"'
          printf '%s' "$status" | grep -F '"controlPlane":"CLOUDFLARE_D1"'
          printf '%s' "$status" | grep -F '"pool_schema":"MLS-R44-CLOUDFLARE-POOL-1"'
          echo 'R44_CONTROL_PLANE_OK'

      - name: Sincronizar credenciales D1 Analytics
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          if [ -n "$D1_ANALYTICS_TOKEN" ] && [ -n "$D1_ANALYTICS_ACCOUNT_ID" ]; then
            printf '%s' "$D1_ANALYTICS_TOKEN" | npx wrangler secret put D1_ANALYTICS_TOKEN
            printf '%s' "$D1_ANALYTICS_ACCOUNT_ID" | npx wrangler secret put D1_ANALYTICS_ACCOUNT_ID
            echo 'Credenciales D1 Analytics de solo lectura sincronizadas.'
          else
            echo '::warning::D1 Analytics no está configurado: /status mantendrá el countdown pero el consumo oficial aparecerá como no disponible.'
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ANALYTICS_TOKEN: ${{ secrets.D1_ANALYTICS_TOKEN }}
          D1_ANALYTICS_ACCOUNT_ID: ${{ secrets.D1_ANALYTICS_ACCOUNT_ID }}
