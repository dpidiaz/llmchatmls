name: Desplegar MLS en produccion

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:chat-editorial
      - run: npm run predeploy
      - run: npm run check
      - name: Desplegar en produccion
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'autoopt-salud-deploy') }}
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verificar panel AUTOOPT en produccion
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'autoopt-salud-deploy') }}
        run: |
          html_status=$(curl --retry 3 --retry-delay 2 -sS -o /tmp/autoopt.html -w '%{http_code}' 'https://llmchatmls.dpidiaz.workers.dev/autoopt.html')
          test "$html_status" = '200'
          grep -q 'Salud AUTOOPT' /tmp/autoopt.html
          health_status=$(curl --retry 3 --retry-delay 2 -sS -o /tmp/autoopt-health.json -w '%{http_code}' 'https://llmchatmls.dpidiaz.workers.dev/api/wiki/editorial/chat/autoopt/health')
          test "$health_status" = '401'
