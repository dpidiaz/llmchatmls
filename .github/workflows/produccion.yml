name: Desplegar MLS en produccion

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:chat-editorial
      - run: npm run predeploy
      - run: npm run check
      - name: Desplegar en produccion
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Diagnosticar panel AUTOOPT en produccion
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'autoopt-salud-deploy' }}
        run: |
          html_status=$(curl --retry 3 --retry-delay 2 -sS -o /tmp/autoopt.html -w '%{http_code}' 'https://llmchatmls.dpidiaz.workers.dev/autoopt.html')
          if grep -q 'Salud AUTOOPT' /tmp/autoopt.html; then panel_marker='present'; else panel_marker='absent'; fi
          health_status=$(curl --retry 3 --retry-delay 2 -sS -o /tmp/autoopt-health.json -w '%{http_code}' 'https://llmchatmls.dpidiaz.workers.dev/api/wiki/editorial/chat/autoopt/health')
          echo "html_status=$html_status"
          echo "panel_marker=$panel_marker"
          echo "health_status=$health_status"
          echo -n 'health_error='; node -e "try{const x=JSON.parse(require('fs').readFileSync('/tmp/autoopt-health.json','utf8')); console.log(x.error||'none')}catch{console.log('non-json')}"
