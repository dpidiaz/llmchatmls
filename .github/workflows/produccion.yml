name: Desplegar MLS en produccion

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:chat-editorial
      - run: npm run predeploy
      - run: node --test test/deploy-contract.test.cjs
      - run: npm run check
      - name: Desplegar en produccion
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verificar Action editorial sin crear lotes
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/verify-chat-deployment.cjs
