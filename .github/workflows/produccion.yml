name: Desplegar MLS en produccion

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:chat-editorial
      - run: npm run predeploy
      - run: node --test test/deploy-contract.test.cjs
      - run: npm run check
      - name: Desplegar en produccion
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Crear snapshot MLS Staging del deploy
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set +e
          http_status=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/mlsstagingsnapshot.json" \
            --write-out '%{http_code}' \
            -X POST 'https://llmchatmls.dpidiaz.workers.dev/api/wiki/editorial/staging/snapshot' \
            -H "Authorization: Bearer $MLS_EDITORIAL_CHAT_KEY" \
            -H 'Content-Type: application/json' \
            --data "{\"sourceCommit\":\"$GITHUB_SHA\"}")
          curl_status=$?
          set -e
          body=$(cat "$RUNNER_TEMP/mlsstagingsnapshot.json" 2>/dev/null || true)
          if [ "$curl_status" -ne 0 ]; then
            printf '%s\n' "$body"
            exit "$curl_status"
          fi
          if [ "$http_status" = "200" ]; then
            printf '%s\n' "$body"
            exit 0
          fi
          if [ "$http_status" = "503" ] && printf '%s' "$body" | grep -q 'credenciales GitHub configuradas'; then
            printf '%s\n' "$body"
            echo '::warning::MLS Staging aún no tiene credenciales GitHub en Cloudflare; producción quedó desplegada y el snapshot se habilitará tras el bootstrap.'
            exit 0
          fi
          if [ "$http_status" = "503" ] && printf '%s' "$body" | grep -qi "daily row read limit"; then
            printf '%s\n' "$body"
            echo '::warning::Snapshot MLS Staging diferido: Cloudflare D1 agotó el límite diario gratuito de rows read. El deploy de producción sí quedó activo; vuelva a ejecutar el workflow después del reset UTC.'
            exit 0
          fi
          printf '%s\n' "$body"
          exit 1
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}

      - name: Verificar Action editorial sin crear lotes
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        run: node scripts/verify-chat-deployment.cjs
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
