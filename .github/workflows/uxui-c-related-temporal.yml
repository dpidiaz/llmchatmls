name: UXUI C certification temporary

on:
  push:
    branches:
      - uxui-r1-discovery
    paths:
      - ".github/workflows/uxui-c-related-temporal.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: test chat editorial
        run: npm run test:chat-editorial
      - name: qa baseline
        run: npm run qa:baseline
      - name: predeploy
        run: npm run predeploy
      - name: recovery verify
        run: npm run recovery:verify
      - name: deploy contract
        run: node --test test/deploy-contract.test.cjs
      - name: wrangler dry run
        run: npm run check
