name: Preparar historial AUTOOPT

on:
  workflow_dispatch:
    inputs:
      database:
        description: Nombre real de la base D1
        required: true
        type: string
      before:
        description: Corte UTC ISO aprobado por el preview
        required: true
        type: string
      batch:
        description: Identificador del lote histórico aprobado
        required: true
        type: string
      confirm:
        description: Escribe STAGE para guardar evidencia sin activarla
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage:
    if: ${{ inputs.confirm == 'STAGE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node 'scripts/autoopt history.cjs' preview --database "${{ inputs.database }}" --remote --before "${{ inputs.before }}" --batch "${{ inputs.batch }}" --out 'AUTOOPT historial.json'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: node 'scripts/autoopt history.cjs' apply --plan 'AUTOOPT historial.json' --approve "$(node -e \"process.stdout.write(require('./AUTOOPT historial.json').digest)\")"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: node 'scripts/autoopt history.cjs' inspect --database "${{ inputs.database }}" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
