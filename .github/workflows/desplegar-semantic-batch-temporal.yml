name: Desplegar generador semántico aislado temporal

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desplegar-semantic-batch-temporal.yml"

permissions:
  contents: read

jobs:
  deploy-temp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mls-semantic-batch-endpoint-temp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inyectar digest y desplegar Worker aislado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          GEN_KEY=$(printf '%s' "${CLOUDFLARE_API_TOKEN}:mls-semantic-batch-v1" | sha256sum | awk '{print $1}')
          GEN_HASH=$(printf '%s' "$GEN_KEY" | sha256sum | awk '{print $1}')
          echo "::add-mask::$GEN_KEY"

          node - "$GEN_HASH" <<'NODE'
          const fs=require('node:fs');
          const hash=process.argv[2];
          const file='scripts/semantic batch worker temp.js';
          let source=fs.readFileSync(file,'utf8');
          const marker='__SEMANTIC_GENERATION_KEY_SHA256__';
          if(!source.includes(marker))throw new Error('No se encontró placeholder de digest.');
          source=source.replaceAll(marker,hash);
          fs.writeFileSync(file,source);
          NODE

          npx wrangler deploy --config wrangler.semantic-batch-temp.jsonc

          status=$(curl --silent --show-error             --output /tmp/batch.json             --write-out '%{http_code}'             -X POST 'https://mls-semantic-generator-temp.dpidiaz.workers.dev/embed'             -H "authorization: Bearer $GEN_KEY"             -H 'content-type: application/json'             --data '{"texts":["prueba semántica uno","prueba semántica dos"]}')
          echo "batch_http_status=$status"
          test "$status" = "200"

          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('/tmp/batch.json','utf8'));
          if(!p.ok||p.model!=='@cf/baai/bge-m3'||p.count!==2||!Array.isArray(p.vectors)||p.vectors.length!==2)throw new Error('Batch endpoint inválido');
          if(!p.vectors.every(v=>Array.isArray(v)&&v.length===p.dimensions&&v.length>100))throw new Error('Vectores inválidos');
          console.log('SEMANTIC_ISOLATED_WORKER_OK dimensions='+p.dimensions);
          NODE
