name: Despliegue MLS temporal

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-once:
    if: ${{ contains(github.event.head_commit.message, '[deploy-once]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:chat-editorial
      - run: npm run predeploy
      - run: node --test test/deploy-contract.test.cjs
      - run: npm run check
      - name: Desplegar MLS
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Sincronizar credenciales D1 Analytics
        shell: bash
        run: |
          if [ -n "$D1_ANALYTICS_TOKEN" ] && [ -n "$D1_ANALYTICS_ACCOUNT_ID" ]; then
            printf '%s' "$D1_ANALYTICS_TOKEN" | npx wrangler secret put D1_ANALYTICS_TOKEN
            printf '%s' "$D1_ANALYTICS_ACCOUNT_ID" | npx wrangler secret put D1_ANALYTICS_ACCOUNT_ID
            echo 'Credenciales D1 Analytics de solo lectura sincronizadas.'
          else
            echo '::warning::D1 Analytics no está configurado.'
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ANALYTICS_TOKEN: ${{ secrets.D1_ANALYTICS_TOKEN }}
          D1_ANALYTICS_ACCOUNT_ID: ${{ secrets.D1_ANALYTICS_ACCOUNT_ID }}
      - name: Crear snapshot MLS Staging del deploy
        shell: bash
        run: |
          set +e
          http_status=$(curl --silent --show-error             --output "$RUNNER_TEMP/mlsstagingsnapshot.json"             --write-out '%{http_code}'             -X POST 'https://llmchatmls.dpidiaz.workers.dev/api/wiki/editorial/staging/snapshot'             -H "Authorization: Bearer $MLS_EDITORIAL_CHAT_KEY"             -H 'Content-Type: application/json'             --data "{\"sourceCommit\":\"$GITHUB_SHA\"}")
          curl_status=$?
          set -e
          body=$(cat "$RUNNER_TEMP/mlsstagingsnapshot.json" 2>/dev/null || true)
          if [ "$curl_status" -ne 0 ]; then
            printf '%s\n' "$body"
            exit "$curl_status"
          fi
          if [ "$http_status" = "200" ]; then
            printf '%s\n' "$body"
            exit 0
          fi
          if [ "$http_status" = "503" ] && printf '%s' "$body" | grep -q 'credenciales GitHub configuradas'; then
            printf '%s\n' "$body"
            echo '::warning::MLS Staging aún no tiene credenciales GitHub en Cloudflare; producción quedó desplegada.'
            exit 0
          fi
          if [ "$http_status" = "503" ] && printf '%s' "$body" | grep -Eqi "daily row (read|write) limit"; then
            printf '%s\n' "$body"
            echo '::warning::Snapshot MLS Staging diferido por límite diario D1; producción sí quedó activa.'
            exit 0
          fi
          printf '%s\n' "$body"
          exit 1
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
      - name: Verificar Action editorial sin crear lotes
        run: node scripts/verify-chat-deployment.cjs
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
