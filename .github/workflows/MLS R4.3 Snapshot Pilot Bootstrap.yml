name: MLS R4.3 Snapshot Wave Bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only or apply a guarded R4.3 remote wave
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      wave_id:
        description: Immutable R4.3 wave id
        required: true
        default: BCR-R43-WAVE-50X5
        type: string
      worker_count:
        description: Remote workers (max 50; each worker owns 5 entries)
        required: true
        default: '50'
        type: string
      confirm:
        description: For apply use APPLY_R43_WAVE_<workers>X5
        required: false
        default: ''
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

# Deliberately the SAME mutex as the existing Global Dispatcher.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'opened' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) && github.event.issue.title == '[MLS R4.3][BOOTSTRAP][APPLY] 50X5' && contains(github.event.issue.body || '', 'MLS_R43_BOOTSTRAP_APPLY_V2') && contains(github.event.issue.body || '', 'APPLY_R43_WAVE_50X5'))) && 'mls-global-dispatcher' || format('mls-global-dispatcher-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.action == 'opened' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
       github.event.issue.title == '[MLS R4.3][BOOTSTRAP][APPLY] 50X5' &&
       contains(github.event.issue.body || '', 'MLS_R43_BOOTSTRAP_APPLY_V2') &&
       contains(github.event.issue.body || '', 'APPLY_R43_WAVE_50X5'))
    runs-on: ubuntu-latest
    env:
      MLS_GITHUB_COOLDOWN_FILE: .mls-github-cooldown.json
      MLS_R43_BOOTSTRAP_MODE: ${{ github.event_name == 'issues' && 'apply' || inputs.mode }}
      MLS_R43_WAVE_ID: ${{ github.event_name == 'issues' && format('BCR-R43-WAVE-50X5-{0}', github.event.issue.number) || inputs.wave_id }}
      MLS_R43_WORKER_COUNT: ${{ github.event_name == 'issues' && '50' || inputs.worker_count }}
      MLS_R43_CONFIRM: ${{ github.event_name == 'issues' && 'APPLY_R43_WAVE_50X5' || inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.MLS_GITHUB_COOLDOWN_FILE }}
          key: mls-github-cooldown-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mls-github-cooldown-

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate guarded bootstrap syntax
        run: node --check 'scripts/MLS R4.3 Snapshot Pilot Bootstrap.cjs'

      - name: Plan or apply R4.3 wave bootstrap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node 'scripts/MLS R4.3 Snapshot Pilot Bootstrap.cjs'

      - name: Preserve GitHub cooldown
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MLS_GITHUB_COOLDOWN_FILE }}
          key: mls-github-cooldown-${{ github.run_id }}-${{ github.run_attempt }}
