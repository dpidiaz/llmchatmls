name: R4.1 Buffered Sync
run-name: 'MLS buffer sync #${{ inputs.request_issue || github.event.issue.number }}'

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      request_issue:
        description: Existing authorized SYNC issue; revalidated by the script
        required: true
        type: string

permissions:
  contents: write
  issues: write

# Exactly the SAME critical section as the Global Dispatcher scheduler.
# Never overlap allocation and publication reconciliation.
concurrency:
  group: mls-global-dispatcher
  cancel-in-progress: false

jobs:
  buffered-sync:
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.event.issue.title, '[MLS Buffered][SYNC]') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) }}
    runs-on: ubuntu-latest
    env:
      MLS_GITHUB_COOLDOWN_FILE: ${{ runner.temp }}/mls-github-cooldown.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.MLS_GITHUB_COOLDOWN_FILE }}
          key: mls-github-cooldown-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mls-github-cooldown-
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Parse and authenticate sync request
        id: request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/R4-1-buffered-remote.cjs request "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
      - name: Recover immutable inbox bundle and prepare isolated staging branch
        shell: bash
        env:
          INBOX: ${{ steps.request.outputs.inboxBranch }}
          ISSUE: ${{ steps.request.outputs.issueNumber }}
        run: |
          set -euo pipefail
          # Keep an independent, read-only canonical main snapshot; staged Evidence must not change pool eligibility.
          git worktree add --detach "$RUNNER_TEMP/r41-canonical" main
          echo "MLS_R41_CANONICAL_ROOT=$RUNNER_TEMP/r41-canonical" >> "$GITHUB_ENV"
          git fetch origin "+refs/heads/$INBOX:refs/remotes/origin/r41-inbox"
          git show "refs/remotes/origin/r41-inbox:r41-package.json" > "$RUNNER_TEMP/r41-package.json"
          node scripts/R4-1-buffered-remote.cjs unpack "$RUNNER_TEMP/r41-buffer" "$RUNNER_TEMP/r41-package.json"
          target="r41/staged/$ISSUE"
          remote="$(git ls-remote --heads origin "refs/heads/$target")"
          if [ -n "$remote" ]; then
            git fetch origin "+refs/heads/$target:refs/remotes/origin/r41-target"
            git switch -c "$target" "refs/remotes/origin/r41-target"
            echo "STAGE_BRANCH_EXISTED=1" >> "$GITHUB_ENV"
          else
            git switch -c "$target" main
            echo "STAGE_BRANCH_EXISTED=0" >> "$GITHUB_ENV"
          fi
          echo "TARGET_BRANCH=$target" >> "$GITHUB_ENV"
      - name: Reconcile live ownership and prepare exact Evidence files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.request.outputs.issueNumber }}
        run: node scripts/R4-1-buffered-remote.cjs prepare "$RUNNER_TEMP/r41-buffer" . "$ISSUE"
      - name: Canonical R33 certification before grouped write
        run: |
          node scripts/R33\ evidence\ git\ validate.cjs
          node --test 'test/r33 evidence editorial batch.test.cjs' 'test/r33 evidence farm.test.cjs'
      - name: R4.1 academic traceability before grouped write
        run: node scripts/R4-1-buffered-academic-check.cjs "$RUNNER_TEMP/r41-buffer" .
      - name: Single grouped commit and non-force push
        shell: bash
        env:
          ISSUE: ${{ steps.request.outputs.issueNumber }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/R4-1-buffered-remote.cjs stage-local "$RUNNER_TEMP/r41-buffer" .
          if ! git diff --cached --quiet; then
            git commit -m "evidence(r4.1): stage immutable buffer $ISSUE"
          elif [ "$STAGE_BRANCH_EXISTED" = "0" ]; then
            # All assigned files already byte-identical: still create an auditable per-batch commit.
            git commit --allow-empty -m "evidence(r4.1): stage immutable buffer $ISSUE"
          fi
          sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "STAGED_SHA=$sha" >> "$GITHUB_ENV"
      - name: Confirm exact remote SHA and mark reservation STAGED
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.request.outputs.issueNumber }}
        run: node scripts/R4-1-buffered-remote.cjs mark "$RUNNER_TEMP/r41-buffer" . "$ISSUE" "$TARGET_BRANCH" "$STAGED_SHA"
      - name: Preserve GitHub cooldown after interruption
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MLS_GITHUB_COOLDOWN_FILE }}
          key: mls-github-cooldown-${{ github.run_id }}-${{ github.run_attempt }}
