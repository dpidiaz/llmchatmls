name: Temporary advanced details audit

on:
  push:
    branches:
      - audit/remove-advanced-details-setting
    paths:
      - '.github/audit-advanced-details-trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test 'test/detalles avanzados removal.test.cjs'
      - run: npm run predeploy
      - name: Verify advanced-details removal in built assets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const files=[...fs.readdirSync('public/js').filter(name=>name.endsWith('.js')).map(name=>'public/js/'+name),'public/index.html'].filter(fs.existsSync);
          const forbidden=['advancedDetails','advancedToggle','Detalles avanzados','mlsAdvancedDetails'];
          const failures=[];
          for(const file of files){
            const text=fs.readFileSync(file,'utf8');
            for(const needle of forbidden) if(text.includes(needle)) failures.push(file+': '+needle);
          }
          if(failures.length){
            console.error('FORBIDDEN_REFS',failures);
            process.exit(1);
          }
          const app=fs.readFileSync('public/js/app.js','utf8');
          for(const required of ['Profesor IA','Tamaño de letra','Fondo']) if(!app.includes(required)) throw new Error('Falta ajuste requerido: '+required);
          console.log('ADVANCED_DETAILS_REMOVAL_OK');
          NODE
      - run: npm run test:chat-editorial
