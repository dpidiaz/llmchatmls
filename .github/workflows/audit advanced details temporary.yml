name: Temporary advanced details audit

on:
  push:
    branches:
      - audit/remove-advanced-details-setting
    paths:
      - '.github/audit-advanced-details-trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run predeploy
      - name: Locate advanced-details UI and bindings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const files=[...fs.readdirSync('public/js').filter(name=>name.endsWith('.js')).map(name=>'public/js/'+name),'public/index.html'].filter(fs.existsSync);
          for(const file of files){
            const text=fs.readFileSync(file,'utf8');
            for(const needle of ['advancedDetails','advancedToggle','Detalles avanzados']){
              const indexes=[];
              let at=0;
              while((at=text.indexOf(needle,at))!==-1){indexes.push(at);at+=needle.length;}
              console.log('AUDIT',file,needle,'COUNT',indexes.length);
              indexes.slice(0,12).forEach((idx,n)=>{
                console.log('CTX',file,needle,n+1,JSON.stringify(text.slice(Math.max(0,idx-260),Math.min(text.length,idx+needle.length+360))));
              });
            }
          }
          NODE
