name: Temporary offline pack manager validation

on:
  push:
    branches:
      - feature/offline-pack-language-manager
    paths:
      - '.github/validate-offline-pack-manager-trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test 'test/traductor offline.test.cjs' 'test/traductor pronunciacion.test.cjs'
      - run: npm run test:chat-editorial
      - run: npm run predeploy
