name: Sanear bundle Fase 5 temporal

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sanear-bundle-fase5-temporal.yml"

permissions:
  contents: write

jobs:
  sanitize-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Sanear bundle histórico
        shell: bash
        run: |
          set -euo pipefail
          archive='MASTER LANGUAGE SYSTEM REVISION 32 BUNDLE.tar.gz'
          clean='/tmp/MASTER LANGUAGE SYSTEM REVISION 32 BUNDLE CLEAN.tar.gz'
          before=$(stat -c '%s' "$archive")
          node "scripts/sanear bundle r32.js" "$archive" "$clean"
          after=$(stat -c '%s' "$clean")
          mv "$clean" "$archive"
          echo "Bundle original bytes: $before"
          echo "Bundle saneado bytes: $after"
          echo "Reducción bytes: $((before-after))"

      - name: Verificar bundle saneado
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {validateSanitizedArchive}=require('./scripts/sanear bundle r32.js');
          const r=validateSanitizedArchive('MASTER LANGUAGE SYSTEM REVISION 32 BUNDLE.tar.gz');
          console.log(JSON.stringify(r,null,2));
          NODE
          tar -tzf "MASTER LANGUAGE SYSTEM REVISION 32 BUNDLE.tar.gz" | grep -E '(^|/)public/index.html$' >/dev/null
          if tar -tzf "MASTER LANGUAGE SYSTEM REVISION 32 BUNDLE.tar.gz" | grep -E '(^|/)(public/data/|public/mls-staging-targets/|src/)'; then
            echo "::error::El bundle limpio conserva rutas prohibidas"
            exit 1
          fi

      - name: Suite MLS con bundle limpio
        run: npm run test:chat-editorial

      - name: Construir MLS con bundle limpio
        run: npm run predeploy

      - name: Verificar contrato
        run: node --test test/deploy-contract.test.cjs

      - name: Wrangler dry run con bundle limpio
        run: npm run check

      - name: Publicar bundle limpio en rama de revisión
        shell: bash
        run: |
          set -euo pipefail
          branch='mls-sanitized-bundle-output'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add -- "MASTER LANGUAGE SYSTEM REVISION 32 BUNDLE.tar.gz"
          if git diff --cached --quiet; then
            echo "::error::El bundle saneado no produjo cambio"
            exit 1
          fi
          git commit -m "Replace historical R32 bundle with legacy-free shell"
          git push --force origin "HEAD:refs/heads/$branch"
