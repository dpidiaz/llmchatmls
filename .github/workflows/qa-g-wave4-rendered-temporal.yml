name: QA G Wave 4 final certification temporal

on:
  push:
    branches:
      - uxui-r1-accessibility
    paths:
      - ".github/workflows/qa-g-wave4-rendered-temporal.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: 1 Baseline final
        run: npm run qa:baseline

      - name: 2 Test suite editorial
        run: npm run test:chat-editorial

      - name: 3 Tests correctivos G
        run: node --test 'test/accessibility responsive baseline.test.cjs' 'test/accessibility responsive corrections.test.cjs'

      - name: 4 Predeploy
        run: npm run predeploy

      - name: Diagnóstico de foco inicial
        run: |
          grep -RniE "autofocus|\.focus\(|focus\(" public/js public/index.html | head -80 || true
      - name: Instalar Chromium de QA sin modificar package.json
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Servir build local
        run: |
          python3 -m http.server 8788 -d public >/tmp/mls-http.log 2>&1 &
          echo $! > /tmp/mls-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mls-http.log
          exit 1

      - name: 5-8 QA Chromium, reflow, skip link y focus
        run: |
          cat > /tmp/qa-wave4-final.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const widths=[320,375,390,430,768,1024,1280,1440,1920];
          const base='http://127.0.0.1:8788';
          const out={viewports:{},reader:{},professor:{},virtuoso:{},reflow:{},scriptProbes:{},issues:[]};
          const issue=(kind,data)=>out.issues.push({kind,...data});

          (async()=>{
            const browser=await chromium.launch({headless:true});

            for(const width of widths){
              const context=await browser.newContext({viewport:{width,height:900}});
              const page=await context.newPage();
              await page.goto(base+'/',{waitUntil:'networkidle'});

              const home=await page.evaluate(()=>{
                const root=document.documentElement;
                const targets=[...document.querySelectorAll('button,input,select,[role="button"],nav a,.btn')].filter(el=>{
                  const s=getComputedStyle(el),r=el.getBoundingClientRect();
                  return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0;
                }).map(el=>{const r=el.getBoundingClientRect();return {
                  tag:el.tagName,text:(el.innerText||el.getAttribute('aria-label')||'').trim().slice(0,70),
                  w:+r.width.toFixed(1),h:+r.height.toFixed(1)
                }}).filter(x=>x.w<44||x.h<44);
                const skip=document.querySelector('.mls-skip-link');
                return {
                  overflow:root.scrollWidth>root.clientWidth+1,
                  scrollWidth:root.scrollWidth,clientWidth:root.clientWidth,
                  skipLink:!!skip,
                  skipHref:skip?.getAttribute('href')||'',
                  skipTarget:skip?.getAttribute('href')?!!document.querySelector(skip.getAttribute('href')):false,
                  smallTargetCount:targets.length,
                  smallTargets:targets.slice(0,12)
                };
              });

              await page.keyboard.press('Tab');
              const firstFocus=await page.evaluate(()=>{
                const a=document.activeElement,s=a?getComputedStyle(a):null;
                return {
                  tag:a?.tagName||'',className:a?.className||'',id:a?.id||'',
                  text:(a?.innerText||a?.getAttribute?.('aria-label')||'').trim().slice(0,80),
                  outlineStyle:s?.outlineStyle||'',outlineWidth:s?.outlineWidth||''
                };
              });

              out.viewports[width]={home,firstFocus};
              if(home.overflow)issue('horizontal-overflow',{area:'Home',width});
              if(!home.skipLink||!home.skipTarget)issue('skip-link',{width,home});
              if(width<=430&&home.smallTargetCount)issue('touch-targets',{area:'Home',width,count:home.smallTargetCount,sample:home.smallTargets});
              if(!String(firstFocus.className).includes('mls-skip-link'))issue('first-focus',{width,firstFocus});
              if(firstFocus.outlineStyle==='none'||parseFloat(firstFocus.outlineWidth||'0')<2)issue('focus-visible',{width,firstFocus});

              const code=await page.evaluate(()=>window.MLS_INDEX?.[0]?.code||null);
              if(code){
                await page.evaluate(c=>{location.hash='#entry='+encodeURIComponent(c)},code);
                await page.waitForTimeout(700);

                const reader=await page.evaluate(()=>{
                  const q=s=>document.querySelector(s);
                  const rect=s=>{const e=q(s);if(!e)return null;const r=e.getBoundingClientRect();return {w:+r.width.toFixed(1),display:getComputedStyle(e).display}};
                  const root=document.documentElement;
                  return {
                    overflow:root.scrollWidth>root.clientWidth+1,
                    main:rect('.reader-main'),left:rect('.reader-left'),right:rect('.reader-right')
                  };
                });
                out.reader[width]=reader;
                if(reader.overflow)issue('horizontal-overflow',{area:'Reader',width});
                if((width===1024||width===1280)&&reader.main&&reader.main.w<600)issue('reader-width',{width,mainWidth:reader.main.w});

                const ai=page.locator('#aiExplainBtn');
                if(await ai.count()){
                  await ai.focus();
                  await ai.click();
                  await page.waitForTimeout(150);
                  const opened=await page.evaluate(()=>{
                    const m=document.querySelector('#aiTutorModal'),a=document.activeElement;
                    return {
                      exists:!!m,
                      overflowX:!!m&&(m.scrollWidth>m.clientWidth+1),
                      role:m?.getAttribute('role')||m?.tagName?.toLowerCase()||'',
                      ariaLabel:m?.getAttribute('aria-label')||'',
                      focusedTag:a?.tagName||'',
                      focusedLabel:a?.getAttribute?.('aria-label')||''
                    };
                  });
                  const close=page.locator('#aiTutorModal [data-ai-close]');
                  if(await close.count())await close.click();
                  await page.waitForTimeout(120);
                  const focusAfterClose=await page.evaluate(()=>({
                    id:document.activeElement?.id||'',
                    text:(document.activeElement?.innerText||document.activeElement?.getAttribute?.('aria-label')||'').trim().slice(0,60)
                  }));
                  out.professor[width]={...opened,focusAfterClose};
                  if(opened.overflowX)issue('professor-overflow',{width});
                  if(opened.focusedTag!=='TEXTAREA')issue('professor-initial-focus',{width,opened});
                  if(focusAfterClose.id!=='aiExplainBtn')issue('professor-focus-restore',{width,focusAfterClose});
                }
              }

              if([320,390,768,1024].includes(width)){
                const probe=await page.evaluate(()=>{
                  const host=document.createElement('div');
                  host.style.cssText='position:absolute;left:0;top:0;width:min(100%,720px);font-size:16px;line-height:1.6;overflow-wrap:anywhere;visibility:hidden';
                  host.innerHTML='<p lang="ja">日本語の文法を学びます。助詞と動詞の活用を確認します。</p><p lang="zh-Hant">繁體中文語法與句子結構測試。</p><p lang="ko">한국어 문법과 문장 구조를 확인합니다.</p><p lang="ru">Проверка русской типографики и переноса строк.</p>';
                  document.body.appendChild(host);
                  const rows=[...host.children].map(el=>({lang:el.lang,scrollWidth:el.scrollWidth,clientWidth:el.clientWidth,scrollHeight:el.scrollHeight,clientHeight:el.clientHeight,font:getComputedStyle(el).fontFamily}));
                  host.remove();
                  return {rows,clipped:rows.some(r=>r.scrollWidth>r.clientWidth+1||r.scrollHeight>r.clientHeight+1)};
                });
                out.scriptProbes[width]=probe;
                if(probe.clipped)issue('script-clipping',{width,rows:probe.rows});
              }
              await context.close();
            }

            for(const width of widths){
              const context=await browser.newContext({viewport:{width,height:900}});
              const page=await context.newPage();
              await page.goto(base+'/virtuoso.html',{waitUntil:'networkidle'});
              const v=await page.evaluate(()=>{
                const root=document.documentElement;
                const results=document.getElementById('results');
                const status=document.getElementById('status');
                const small=[...document.querySelectorAll('button,input,select,a')].filter(el=>{
                  const s=getComputedStyle(el),r=el.getBoundingClientRect();
                  return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0&&(r.width<44||r.height<44);
                }).map(el=>{const r=el.getBoundingClientRect();return {tag:el.tagName,text:(el.innerText||el.getAttribute('aria-label')||'').trim().slice(0,60),w:+r.width.toFixed(1),h:+r.height.toFixed(1)}});
                return {
                  overflow:root.scrollWidth>root.clientWidth+1,
                  resultsLive:results?.getAttribute('aria-live')||'',
                  statusRole:status?.getAttribute('role')||'',
                  smallTargetCount:small.length,
                  smallTargets:small.slice(0,8)
                };
              });
              out.virtuoso[width]=v;
              if(v.overflow)issue('horizontal-overflow',{area:'Virtuoso',width});
              if(v.resultsLive!=='polite'||v.statusRole!=='status')issue('virtuoso-announcement',{width,v});
              if(width<=430&&v.smallTargetCount)issue('touch-targets',{area:'Virtuoso',width,count:v.smallTargetCount,sample:v.smallTargets});
              await context.close();
            }

            // Reflow equivalence: 1280px at 200% ~= 640 CSS px; at 400% ~= 320 CSS px.
            out.reflow.at200=out.viewports[768]?.home?.overflow===false&&out.reader[768]?.overflow===false;
            out.reflow.at400=out.viewports[320]?.home?.overflow===false&&out.reader[320]?.overflow===false;
            if(!out.reflow.at200)issue('reflow',{zoom:'200%'});
            if(!out.reflow.at400)issue('reflow',{zoom:'400%'});

            await browser.close();
            console.log('WAVE4_FINAL_QA '+JSON.stringify(out));
            assert.deepEqual(out.issues,[],'QA renderizado encontró defectos: '+JSON.stringify(out.issues));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/qa-wave4-final.cjs

      - name: 9 Recovery verify
        run: npm run recovery:verify

      - name: 10 Deploy contract
        run: node --test test/deploy-contract.test.cjs

      - name: 11 Wrangler dry-run
        run: npm run check

# final rerun after baseline detector alignment
