name: MLS R4.3 R33 Handoff

on:
  workflow_dispatch:
    inputs:
      wave_issue:
        description: Reconciled R4.3 wave issue number
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: mls-global-dispatcher
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MLS_GITHUB_COOLDOWN_FILE: .mls-github-cooldown.json
      MLS_R43_R33_HANDOFF_WAVE_ISSUE: ${{ inputs.wave_issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/cache/restore@v4
        with:
          path: .mls-github-cooldown.json
          key: mls-github-cooldown-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mls-github-cooldown-
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover R4.3 to R33 ownership handoff
        run: node 'scripts/MLS R4.3 R33 Handoff.cjs'
      - name: Preserve GitHub cooldown
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .mls-github-cooldown.json
          key: mls-github-cooldown-${{ github.run_id }}-${{ github.run_attempt }}
