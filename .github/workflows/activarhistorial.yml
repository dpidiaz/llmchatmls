name: Activar historial AUTOOPT

on:
  workflow_dispatch:
    inputs:
      database:
        description: Nombre real de la base D1
        required: true
        type: string
      batch:
        description: Lote histórico staged que se va a activar
        required: true
        type: string
      confirm:
        description: Escribe ACTIVATE para hacer visible el lote a AUTOOPT
        required: true
        type: string

permissions:
  contents: read

jobs:
  activate:
    if: ${{ inputs.confirm == 'ACTIVATE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node 'scripts/autoopt history.cjs' activate --database "${{ inputs.database }}" --remote --batch "${{ inputs.batch }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: node 'scripts/autoopt history.cjs' inspect --database "${{ inputs.database }}" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
