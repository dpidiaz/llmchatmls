name: Temporary Translator production smoke

on:
  push:
    branches:
      - main
    paths:
      - '.github/verify-translator-production-trigger'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Translator production route
        shell: bash
        run: |
          set -euo pipefail
          url='https://llmchatmls.dpidiaz.workers.dev/traductor'
          result=$(curl --silent --show-error --location --max-redirs 3 --output "$RUNNER_TEMP/traductor.html" --write-out '%{http_code} %{url_effective} %{num_redirects}' "$url")
          echo "$result"
          code=$(printf '%s' "$result" | awk '{print $1}')
          redirects=$(printf '%s' "$result" | awk '{print $3}')
          test "$code" = "200"
          test "$redirects" -le 1
          grep -q '<title>Traductor · MASTER LANGUAGE SYSTEM</title>' "$RUNNER_TEMP/traductor.html"
