name: MLS Global Dispatcher Worker Events

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: mls-global-assignment-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  worker-event:
    if: ${{ startsWith(github.event.issue.title, '[MLS Dispatcher][LEASED]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Procesar evento MLS Global Dispatcher
        run: node 'scripts/MLS global dispatcher worker.cjs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
