name: Desplegar fix hero Buscar una vez

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desplegar-fix-hero-buscar-temporal.yml"

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:chat-editorial
      - run: npm run predeploy
      - run: npm run recovery:verify
      - run: npm run check
      - name: Desplegar
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verificar hero Buscar en producción
        shell: bash
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'
          for i in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error "$base/js/app.js?verify=$GITHUB_SHA" -o app.js &&
               curl --fail --silent --show-error "$base/virtuoso" -o virtuoso.html; then
              break
            fi
            sleep 3
          done
          node - <<'NODE'
          const fs=require('node:fs');
          const app=fs.readFileSync('app.js','utf8');
          const virtuoso=fs.readFileSync('virtuoso.html','utf8');
          const good='class="btn primary big-action" onclick="location.href=\'/virtuoso\'">⌕ Buscar</button>';
          const bad='class="btn primary big-action" onclick="location.hash=\'#search\'">⌕ Buscar</button>';
          if(!app.includes(good))throw new Error('El CTA Buscar del hero no apunta a /virtuoso');
          if(app.includes(bad))throw new Error('El CTA Buscar del hero todavía apunta a #search');
          if(!app.includes("onclick=\"location.hash='#entry=${recent.code}'\">↺ Seguir leyendo</button>"))throw new Error('Seguir leyendo cambió inesperadamente');
          if(!/<h1>Virtuoso<\/h1>/.test(virtuoso))throw new Error('Virtuoso no está disponible');
          console.log('HERO_BUSCAR_VIRTUOSO_OK');
          NODE

# one-shot trigger
