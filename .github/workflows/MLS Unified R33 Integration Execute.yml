name: MLS Unified R33 Integration Execute

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Canonical Dispatcher integration issue
        required: true
        type: string
      comment_id:
        description: Auditable integration execute comment
        required: true
        type: string
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  integrate:
    concurrency:
      group: mls-unified-main-integration
      cancel-in-progress: false
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (startsWith(github.event.issue.title, '[MLS Dispatcher][LEASED]') &&
          contains(github.event.comment.body, 'MLS_UNIFIED_R33_INTEGRATION_EXECUTE') &&
          (github.event.comment.author_association == 'OWNER' ||
           github.event.comment.author_association == 'MEMBER' ||
           github.event.comment.author_association == 'COLLABORATOR' ||
           github.event.comment.user.login == 'github-actions[bot]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check durable secondary writer cooldown
        id: sink_guard
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
        run: |
          cp 'scripts/r44 sink guard.cjs' "$RUNNER_TEMP/mls-sink-guard.cjs"
          node "$RUNNER_TEMP/mls-sink-guard.cjs" check
      - name: Validate leased Unified integration
        id: prep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MLS_UNIFIED_ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number || '' }}
          MLS_UNIFIED_COMMENT_ID: ${{ github.event.inputs.comment_id || github.event.comment.id || '' }}
        run: |
          cp 'scripts/MLS unified r33 integration execute.cjs' "$RUNNER_TEMP/mls-unified-r33-integration.cjs"
          node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" prepare
      - name: Checkout exact assignment branch
        env:
          BRANCH: ${{ steps.prep.outputs.branch }}
        run: |
          git fetch --no-tags origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout -B unified-integration "refs/remotes/origin/$BRANCH"
      - name: Materialize pinned certified sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" apply-sources "${{ steps.prep.outputs.bundle_path }}"
      - name: Regenerate canonical R33 indexes
        run: npm run r33:indexes:write
      - name: Stage and validate exact integration scope
        id: scope
        run: |
          git add -- 'MLS R32 EDITORIAL/evidence git' content
          node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" validate-staged "${{ steps.prep.outputs.bundle_path }}"
      - name: Run R33 integration tests
        run: |
          npm run test:r33-github-native
          node --test 'test/r33 evidence farm.test.cjs'
      - name: Record idempotent no-op checkpoint
        if: ${{ steps.scope.outputs.has_changes == 'false' }}
        id: noop_checkpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" noop-checkpoint-event "${{ steps.prep.outputs.bundle_path }}" "${{ github.run_id }}"
      - name: Apply no-op checkpoint through canonical Dispatcher worker
        if: ${{ steps.scope.outputs.has_changes == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNTHETIC_EVENT_PATH: ${{ steps.noop_checkpoint.outputs.event_path }}
        run: GITHUB_EVENT_PATH="$SYNTHETIC_EVENT_PATH" node 'scripts/MLS global dispatcher worker.cjs'
      - name: Record idempotent no-op finish
        if: ${{ steps.scope.outputs.has_changes == 'false' }}
        id: noop_finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" noop-finish-event "${{ steps.prep.outputs.bundle_path }}" "${{ github.run_id }}"
      - name: Finish idempotent no-op through canonical Dispatcher worker
        if: ${{ steps.scope.outputs.has_changes == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNTHETIC_EVENT_PATH: ${{ steps.noop_finish.outputs.event_path }}
        run: GITHUB_EVENT_PATH="$SYNTHETIC_EVENT_PATH" node 'scripts/MLS global dispatcher worker.cjs'
      - name: Commit and push integration branch
        if: ${{ steps.scope.outputs.has_changes == 'true' }}
        id: commit
        env:
          BRANCH: ${{ steps.prep.outputs.branch }}
          ASSIGNMENT: ${{ steps.prep.outputs.assignment_id }}
        run: |
          if [ "${{ steps.scope.outputs.needs_commit }}" = 'true' ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "r33(unified): integrate $ASSIGNMENT"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Open serialized integration PR or select safe direct fallback
        if: ${{ steps.scope.outputs.has_changes == 'true' }}
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" open-pr "${{ steps.prep.outputs.bundle_path }}" "${{ steps.commit.outputs.head_sha }}"
      - name: Wait for required R33 PR check
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'pr' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" wait-check "${{ steps.commit.outputs.head_sha }}"
      - name: Record premerge checkpoint
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'pr' }}
        id: premerge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" premerge-event "${{ steps.prep.outputs.bundle_path }}" "${{ steps.commit.outputs.head_sha }}" "${{ steps.pr.outputs.pr_number }}" "${{ github.run_id }}"
      - name: Apply premerge event through canonical Dispatcher worker
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'pr' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNTHETIC_EVENT_PATH: ${{ steps.premerge.outputs.event_path }}
        run: GITHUB_EVENT_PATH="$SYNTHETIC_EVENT_PATH" node 'scripts/MLS global dispatcher worker.cjs'
      - name: Merge with expected head SHA
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'pr' }}
        id: merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" merge-pr "${{ steps.prep.outputs.bundle_path }}" "${{ steps.pr.outputs.pr_number }}" "${{ steps.commit.outputs.head_sha }}"
      - name: Record postmerge checkpoint
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'pr' }}
        id: postmerge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" postmerge-event "${{ steps.prep.outputs.bundle_path }}" "${{ steps.merge.outputs.merge_sha }}" "${{ steps.pr.outputs.pr_number }}" "${{ steps.commit.outputs.head_sha }}" "${{ github.run_id }}"
      - name: Apply postmerge event through canonical Dispatcher worker
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'pr' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNTHETIC_EVENT_PATH: ${{ steps.postmerge.outputs.event_path }}
        run: GITHUB_EVENT_PATH="$SYNTHETIC_EVENT_PATH" node 'scripts/MLS global dispatcher worker.cjs'
      - name: Record finish event
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'pr' }}
        id: finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" finish-event "${{ steps.prep.outputs.bundle_path }}" "${{ steps.merge.outputs.merge_sha }}" "${{ steps.pr.outputs.pr_number }}" "${{ steps.commit.outputs.head_sha }}" "${{ github.run_id }}"
      - name: Finish through canonical Dispatcher worker
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'pr' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNTHETIC_EVENT_PATH: ${{ steps.finish.outputs.event_path }}
        run: GITHUB_EVENT_PATH="$SYNTHETIC_EVENT_PATH" node 'scripts/MLS global dispatcher worker.cjs'

      - name: Record direct fallback premerge checkpoint
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'direct' }}
        id: direct_premerge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" direct-premerge-event "${{ steps.prep.outputs.bundle_path }}" "${{ steps.commit.outputs.head_sha }}" "${{ github.run_id }}"
      - name: Apply direct fallback premerge through canonical Dispatcher worker
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'direct' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNTHETIC_EVENT_PATH: ${{ steps.direct_premerge.outputs.event_path }}
        run: GITHUB_EVENT_PATH="$SYNTHETIC_EVENT_PATH" node 'scripts/MLS global dispatcher worker.cjs'
      - name: Merge validated branch directly to main
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'direct' }}
        id: direct_merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" direct-merge "${{ steps.prep.outputs.bundle_path }}" "${{ steps.commit.outputs.head_sha }}"
      - name: Record direct fallback postmerge checkpoint
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'direct' }}
        id: direct_postmerge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" direct-postmerge-event "${{ steps.prep.outputs.bundle_path }}" "${{ steps.direct_merge.outputs.merge_sha }}" "${{ steps.commit.outputs.head_sha }}" "${{ github.run_id }}"
      - name: Apply direct fallback postmerge through canonical Dispatcher worker
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'direct' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNTHETIC_EVENT_PATH: ${{ steps.direct_postmerge.outputs.event_path }}
        run: GITHUB_EVENT_PATH="$SYNTHETIC_EVENT_PATH" node 'scripts/MLS global dispatcher worker.cjs'
      - name: Reconcile missing direct fallback postmerge checkpoint
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'direct' }}
        id: direct_postmerge_reconcile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" direct-postmerge-reconcile "${{ steps.prep.outputs.bundle_path }}" "${{ steps.direct_merge.outputs.merge_sha }}" "${{ steps.commit.outputs.head_sha }}" "${{ github.run_id }}"
      - name: Apply recovered direct fallback postmerge through canonical Dispatcher worker
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'direct' && steps.direct_postmerge_reconcile.outputs.recovery_needed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNTHETIC_EVENT_PATH: ${{ steps.direct_postmerge_reconcile.outputs.event_path }}
        run: GITHUB_EVENT_PATH="$SYNTHETIC_EVENT_PATH" node 'scripts/MLS global dispatcher worker.cjs'
      - name: Require persisted direct fallback postmerge ACK
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'direct' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" verify-direct-postmerge "${{ steps.prep.outputs.bundle_path }}" "${{ steps.direct_merge.outputs.merge_sha }}" "${{ steps.commit.outputs.head_sha }}"
      - name: Record direct fallback finish
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'direct' }}
        id: direct_finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" direct-finish-event "${{ steps.prep.outputs.bundle_path }}" "${{ steps.direct_merge.outputs.merge_sha }}" "${{ steps.commit.outputs.head_sha }}" "${{ github.run_id }}"
      - name: Finish direct fallback through canonical Dispatcher worker
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'direct' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNTHETIC_EVENT_PATH: ${{ steps.direct_finish.outputs.event_path }}
        run: GITHUB_EVENT_PATH="$SYNTHETIC_EVENT_PATH" node 'scripts/MLS global dispatcher worker.cjs'
      - name: Verify direct fallback finish was persisted
        if: ${{ steps.scope.outputs.has_changes == 'true' && steps.pr.outputs.mode == 'direct' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/mls-unified-r33-integration.cjs" verify-direct-finish "${{ steps.prep.outputs.bundle_path }}" "${{ steps.direct_merge.outputs.merge_sha }}" "${{ steps.commit.outputs.head_sha }}"

      - name: Preserve durable retry after writer failure
        if: ${{ failure() && steps.sink_guard.outcome == 'success' }}
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
        run: node "$RUNNER_TEMP/mls-sink-guard.cjs" degrade
