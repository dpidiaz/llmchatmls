name: MLS R33 1725 Cloudflare one-shot authorized

on:
  push:
    branches:
      - 'deploy/mls-r33-1725-snapshot-20260929'

permissions:
  contents: read

concurrency:
  group: mls-cloudflare-oneshot-1725
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy/mls-r33-1725-snapshot-20260929'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 996772378572b931d60d6dac3e78c405f1f07d55
          fetch-depth: 1
      - name: Preflight FREE ONLY - commit, index and existing Cloudflare token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '996772378572b931d60d6dac3e78c405f1f07d55'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '996772378572b931d60d6dac3e78c405f1f07d55'
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::Existing Cloudflare deploy token missing. No deployment.'; exit 1; }
          node - <<'NODE'
          const fs=require('node:fs');
          const list=JSON.parse(fs.readFileSync('MLS R32 EDITORIAL/evidence git/indexes/verified.json','utf8'));
          const ids=['MLS-V10-0361','MLS-V10-0398','MLS-V10-0409'];
          if(list.length!==1725||new Set(list).size!==1725||ids.some(id=>!list.includes(id)))
            throw Error('PINNED_R33_1725_INDEX_OR_CODES_DRIFT');
          console.log('SNAPSHOT_PREFLIGHT_PASS',list.length,ids.join(','));
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:chat-editorial
      - run: npm run test:evidence
      - run: npm run test:canonical-tools
      - run: npm run qa:baseline
      - run: GITHUB_SHA=996772378572b931d60d6dac3e78c405f1f07d55 npm run predeploy
      - name: Confirm generated Evidence runtime before production deploy
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const p='public/data/evidence/manifest.json';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          const h=JSON.parse(fs.readFileSync('public/data/evidence/health.json','utf8'));
          const expected='996772378572b931d60d6dac3e78c405f1f07d55';
          const ids=['MLS-V10-0361','MLS-V10-0398','MLS-V10-0409'];
          if(m.totalEntries!==1725||m.verified!==1725||m.sourceCommit!==expected||h.totalEntries!==1725||h.verified!==1725||
             ids.some(id=>m.entries?.[id]?.status!=='VERIFIED'))throw Error('PREDEPLOY_R33_SNAPSHOT_MISMATCH');
          console.log('PREDEPLOY_1725_MANIFEST_PASS',m.buildId,m.sourceCommit);
          NODE
      - run: npm run recovery:verify
      - run: node --test test/deploy-contract.test.cjs
      - run: npm run check
      - name: Desplegar en produccion
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/deploy/mls-r33-1725-snapshot-20260929' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '996772378572b931d60d6dac3e78c405f1f07d55'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '996772378572b931d60d6dac3e78c405f1f07d55'
          GITHUB_SHA=996772378572b931d60d6dac3e78c405f1f07d55 npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verificar Evidence visible en produccion
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/deploy/mls-r33-1725-snapshot-20260929' }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'
          evidence="$(curl -fsSL --retry 3 --retry-delay 2 "$base/api/wiki/evidence-public/MLS-V10-0093")"
          asset="$(curl -fsSL --retry 3 --retry-delay 2 "$base/data/evidence/by-code/MLS-V10-0093.json")"
          printf '%s\n' "$evidence"
          printf '%s\n' "$asset"
          printf '%s' "$evidence" | grep -F '"status":"VERIFIED"'
          printf '%s' "$evidence" | grep -F '"sourceOfTruth":"github"'
          printf '%s' "$asset" | grep -F '"status": "VERIFIED"'
          printf '%s' "$asset" | grep -F '"sourceOfTruth": "github"'
          printf '%s' "$asset" | grep -F '"references"'
          printf '%s' "$asset" | grep -F 'Real Academia Española'
          reader="$RUNNER_TEMP/mls-reader.js"
          curl -fsSL --retry 3 --retry-delay 2 "$base/js/reader.js" -o "$reader"
          grep -F '/data/evidence/by-code/' "$reader"
          grep -F 'Referencias' "$reader"
          grep -F 'Formato APA 7' "$reader"
          grep -F 'Abrir fuente' "$reader"
          echo 'LIVE_EVIDENCE_READER_OK'
      - name: Verify exact public R33 1725 snapshot and three new entry assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'
          expected_build="$(node -p "require('./public/data/evidence/manifest.json').buildId")"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --retry 2 --retry-delay 2 "$base/data/evidence/manifest.json" -o "$RUNNER_TEMP/mls-live-manifest.json"; then
              if node - "$RUNNER_TEMP/mls-live-manifest.json" "$expected_build" <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const ids=['MLS-V10-0361','MLS-V10-0398','MLS-V10-0409'];
          const ok=m.totalEntries===1725&&m.verified===1725&&m.sourceCommit==='996772378572b931d60d6dac3e78c405f1f07d55'&&m.buildId===process.argv[3]&&
                   ids.every(c=>m.entries?.[c]?.status==='VERIFIED');
          if(!ok)process.exit(1);
          console.log('LIVE_MANIFEST_1725_PASS',m.buildId,m.sourceCommit);
          NODE
              then break; fi
            fi
            if [ "$attempt" -eq 6 ]; then echo '::error::Published Evidence manifest did not match the certified snapshot'; exit 1; fi
            sleep 5
          done
          for code in MLS-V10-0361 MLS-V10-0398 MLS-V10-0409; do
            curl -fsSL --retry 2 --retry-delay 2 "$base/data/evidence/by-code/$code.json" -o "$RUNNER_TEMP/$code.json"
            node - "$RUNNER_TEMP/$code.json" "$code" <<'NODE'
          const fs=require('node:fs');
          const e=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(e.code!==process.argv[3]||e.status!=='VERIFIED'||e.sourceOfTruth!=='github'||!e.references?.length||
             e.provenance?.deploymentSourceCommit!=='996772378572b931d60d6dac3e78c405f1f07d55')throw Error('PUBLIC_EVIDENCE_MISMATCH:'+process.argv[3]);
          console.log('LIVE_EVIDENCE_PASS',e.code,e.status);
          NODE
          done
          echo 'MLS_1725_CLOUDFLARE_DEPLOY_CERTIFIED'
