name: MLS Global Dispatcher Tests

on:
  pull_request:
    paths:
      - 'MLS R32 EDITORIAL/global dispatcher/**'
      - 'scripts/MLS global dispatcher **'
      - 'test/mls global dispatcher**'
      - '.github/workflows/MLS Global Dispatcher **'
      - 'docs/MLS Global Dispatcher/**'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'MLS R32 EDITORIAL/global dispatcher/**'
      - 'scripts/MLS global dispatcher **'
      - 'test/mls global dispatcher**'
      - '.github/workflows/MLS Global Dispatcher **'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test Global Dispatcher
        run: node --test test/mls\\ global\\ dispatcher*.test.cjs
