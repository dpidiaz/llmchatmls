name: MLS R4.3 Snapshot Pilot Init

on:
  workflow_dispatch:
    inputs:
      wave_id:
        description: Immutable R4.3 pilot wave id
        required: true
        type: string
      confirm:
        description: Type PILOT20 to create four 25-entry reservations and one Wave Issue
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: mls-global-dispatcher
  cancel-in-progress: false

jobs:
  init:
    if: ${{ inputs.confirm == 'PILOT20' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Initialize R4.3 20x5 snapshot pilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MLS_R43_WAVE_ID: ${{ inputs.wave_id }}
        run: node 'scripts/MLS R4.3 Snapshot Pilot Init.cjs'
