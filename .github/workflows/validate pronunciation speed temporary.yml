name: Temporary pronunciation speed validation

on:
  push:
    branches:
      - feature/pronunciation-speed-simplification
    paths:
      - '.github/validate-pronunciation-speed-trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test 'test/traductor pronunciacion.test.cjs' 'test/traductor offline.test.cjs'
      - run: npm run test:chat-editorial
      - run: npm run predeploy
