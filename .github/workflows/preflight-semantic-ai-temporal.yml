name: Preflight Workers AI semantic index

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/preflight-semantic-ai-temporal.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verificar permisos AI Gateway para cap de costo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw new Error('Falta CLOUDFLARE_API_TOKEN');
          const headers={authorization:'Bearer '+token,accept:'application/json'};
          const accountsResp=await fetch('https://api.cloudflare.com/client/v4/accounts?per_page=50',{headers});
          const accounts=await accountsResp.json().catch(()=>({}));
          if(!accountsResp.ok||accounts?.success===false)throw new Error('No se pudo listar cuentas: '+JSON.stringify(accounts?.errors||accounts));
          const list=Array.isArray(accounts?.result)?accounts.result:[];
          if(list.length!==1)throw new Error('Se esperaba exactamente una cuenta Cloudflare accesible; encontradas '+list.length);
          const accountId=list[0].id;
          console.log('account_id_detected='+accountId.slice(0,6)+'...');
          const gatewaysResp=await fetch('https://api.cloudflare.com/client/v4/accounts/'+accountId+'/ai-gateway/gateways',{headers});
          const gateways=await gatewaysResp.json().catch(()=>({}));
          console.log('ai_gateway_http_status='+gatewaysResp.status);
          if(!gatewaysResp.ok||gateways?.success===false){
            console.log('ai_gateway_errors='+JSON.stringify(gateways?.errors||gateways));
            console.log('SEMANTIC_GATEWAY_PREFLIGHT=NO_AI_GATEWAY_READ');
            process.exit(51);
          }
          const rows=Array.isArray(gateways?.result)?gateways.result:[];
          console.log('SEMANTIC_GATEWAYS '+JSON.stringify(rows.map(g=>({
            id:g.id,
            workers_ai_billing_mode:g.workers_ai_billing_mode||null,
            spend_limits:g.spend_limits||null
          }))));
          const dedicated=rows.find(g=>g.id==='mls-semantic-zero-cost');
          if(dedicated){
            console.log('SEMANTIC_DEDICATED_GATEWAY '+JSON.stringify({
              id:dedicated.id,
              workers_ai_billing_mode:dedicated.workers_ai_billing_mode||null,
              spend_limits:dedicated.spend_limits||null
            }));
          }
          console.log('SEMANTIC_GATEWAY_PREFLIGHT=AI_GATEWAY_READ_OK');
          NODE
