name: Auditar legacy del build MLS

on:
  push:
    branches:
      - main
    paths:
      - "scripts/auditar legacy build.js"
      - ".github/workflows/auditar-legacy-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Auditar bundle y referencias legacy
        run: node "scripts/auditar legacy build.js"
