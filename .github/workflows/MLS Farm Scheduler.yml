name: MLS Farm Scheduler


on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mls-farm-legacy-manual
  cancel-in-progress: false

jobs:
  scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ejecutar MLS Farm Scheduler
        run: node 'scripts/MLS farm scheduler.cjs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
