name: R44 Isolated worker

on:
  push:
    branches:
      - r44-isolated-s10a-20261003t0254z
    paths:
      - 'r44 isolated trigger/s10b-claim.txt'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Claim R44 s10b
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const bridge = require('./scripts/MLS chat bridge.cjs');
          (async () => {
            const claim = await bridge.executeRemoteOperation('r44ClaimChat', {
              workerId: 'r44-chat-20261002-2046-sol-s10b'
            });
            fs.mkdirSync('r44 isolated result', { recursive: true });
            fs.writeFileSync('r44 isolated result/s10b-claim.json', JSON.stringify(claim, null, 2) + '\n');
            console.log(JSON.stringify({
              success: claim.success,
              status: claim.response?.status || null,
              ticketId: claim.response?.ticket?.ticket_id || claim.response?.context?.ticketId || null
            }));
          })().catch(err => {
            console.error(err);
            process.exitCode = 1;
          });
          NODE
      - name: Persist isolated result
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'MLS Chat Bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add 'r44 isolated result/s10b-claim.json'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist R44 isolated s10b claim'
          git push origin HEAD:r44-isolated-s10a-20261003t0254z
