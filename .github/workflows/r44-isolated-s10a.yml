name: R44 Isolated worker

on:
  push:
    branches:
      - r44-isolated-s10a-20261003t0254z
    paths:
      - 'r44 isolated trigger/s10b-submit.txt'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Submit R44 s10b
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const bridge = require('./scripts/MLS chat bridge.cjs');
          (async () => {
            const submit = await bridge.executeRemoteOperation('r44SubmitChat', {
              bridgeSessionId: 'r44b-7953e19b-904d-4515-bc78-cd3b8b7a27e3',
              ticketId: 'R44-CORPUS-1251',
              entries: [
                { code: 'MLS-V08-0429', outcome: 'PASS_NO_CHANGE' },
                { code: 'MLS-V08-0430', outcome: 'PASS_NO_CHANGE' },
                { code: 'MLS-V08-0432', outcome: 'PASS_NO_CHANGE' },
                { code: 'MLS-V08-0433', outcome: 'PASS_NO_CHANGE' },
                { code: 'MLS-V08-0434', outcome: 'PASS_NO_CHANGE' }
              ]
            });
            fs.mkdirSync('r44 isolated result', { recursive: true });
            fs.writeFileSync('r44 isolated result/s10b-submit.json', JSON.stringify(submit, null, 2) + '\n');
            console.log(JSON.stringify({
              success: submit.success,
              status: submit.response?.status || null,
              ticketId: submit.response?.ticketId || null,
              durable: submit.response?.durable || false
            }));
          })().catch(err => {
            console.error(err);
            process.exitCode = 1;
          });
          NODE
      - name: Persist isolated result
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'MLS Chat Bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add 'r44 isolated result/s10b-submit.json'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist R44 isolated s10b submit'
          git push origin HEAD:r44-isolated-s10a-20261003t0254z
