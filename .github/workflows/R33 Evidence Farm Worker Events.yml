name: R33 Evidence Farm Worker Events

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: r33-evidence-farm-batch-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  worker-event:
    if: ${{ startsWith(github.event.issue.title, '[R33 Evidence Farm][LEASED]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Procesar heartbeat o checkpoint R33 Evidence Farm
        run: node 'scripts/R33 evidence farm worker.cjs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
