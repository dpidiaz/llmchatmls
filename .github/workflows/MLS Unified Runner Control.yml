name: MLS Unified Runner Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: Runner action
        required: true
        default: start
        type: choice
        options:
          - start
          - resume
          - pause
          - stop
      target_entries:
        description: Chat-scoped cumulative target (100-1000, multiple of 5)
        required: false
        default: '1000'
        type: string
      runners:
        description: Cloudflare logical runners
        required: false
        default: '100'
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/MLS Unified Runner Control.yml'

permissions:
  actions: write
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Configure maximum stable runner fanout
        if: ${{ github.event_name == 'push' || inputs.action == 'start' || inputs.action == 'resume' }}
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
          MLS_UNIFIED_BASE_URL: https://llmchatmls.dpidiaz.workers.dev
          REQUESTED_RUNNERS: ${{ github.event_name == 'push' && '100' || inputs.runners || '100' }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$MLS_UNIFIED_BASE_URL/api/unified-runner/control" \
            -H "Authorization: Bearer $MLS_EDITORIAL_CHAT_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"action\":\"configure\",\"runners\":$REQUESTED_RUNNERS}"
      - name: Set runner state
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
          MLS_UNIFIED_BASE_URL: https://llmchatmls.dpidiaz.workers.dev
          REQUESTED_ACTION: ${{ github.event_name == 'push' && 'start' || inputs.action }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$MLS_UNIFIED_BASE_URL/api/unified-runner/control" \
            -H "Authorization: Bearer $MLS_EDITORIAL_CHAT_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"action\":\"$REQUESTED_ACTION\"}"
      - name: Kick Cloudflare hot path
        if: ${{ github.event_name == 'push' || inputs.action == 'start' || inputs.action == 'resume' }}
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
          MLS_UNIFIED_BASE_URL: https://llmchatmls.dpidiaz.workers.dev
          REQUESTED_TARGET: ${{ github.event_name == 'push' && '1000' || inputs.target_entries || '1000' }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$MLS_UNIFIED_BASE_URL/api/unified-runner/kick" \
            -H "Authorization: Bearer $MLS_EDITORIAL_CHAT_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"reason\":\"runner-control-cloudflare-primary\",\"targetEntries\":$REQUESTED_TARGET}"
      - name: Kick GitHub sink coordinator
        if: ${{ github.event_name == 'push' || inputs.action == 'start' || inputs.action == 'resume' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TARGET: ${{ github.event_name == 'push' && '1000' || inputs.target_entries || '1000' }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/github-kick.json"
          code="$(curl --silent --show-error -o "$tmp" -w '%{http_code}' \
            -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/MLS%20Unified%20Web%20Runner.yml/dispatches" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"ref\":\"main\",\"inputs\":{\"target_entries\":\"$REQUESTED_TARGET\"}}")"
          if [ "$code" = "204" ]; then
            echo "GITHUB_SINK_COORDINATOR_DISPATCHED"
          elif [ "$code" = "403" ] || [ "$code" = "429" ]; then
            cat "$tmp" || true
            echo "GITHUB_SINK_DEGRADED_CLOUDFLARE_CONTINUES"
          else
            cat "$tmp" || true
            echo "Unexpected GitHub coordinator HTTP $code" >&2
            exit 1
          fi
      - name: Read unified status
        if: always()
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
          MLS_UNIFIED_BASE_URL: https://llmchatmls.dpidiaz.workers.dev
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$MLS_UNIFIED_BASE_URL/api/unified-runner/status" \
            -H "Authorization: Bearer $MLS_EDITORIAL_CHAT_KEY" \
            -H "Content-Type: application/json" \
            --data '{}'
