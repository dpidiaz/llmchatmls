name: Probe Bergamot same-origin proxy once

on:
  push:
    branches:
      - feature/translator-pronunciation-offline
    paths:
      - ".github/workflows/probe-bergamot-proxy-decompress-once.yml"

permissions:
  contents: read

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare package, registry and proxy server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bergamot-proxy/site
          cd /tmp/bergamot-proxy
          npm init -y >/dev/null
          npm install --no-save @browsermt/bergamot-translator@0.4.9 playwright
          npx playwright install --with-deps webkit >/dev/null
          cp -R node_modules/@browsermt/bergamot-translator site/bergamot
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const registryUrl='https://storage.googleapis.com/moz-fx-translations-data--303e-prod-translations-data/db/models.json';
          const modern=await fetch(registryUrl).then(r=>{if(!r.ok)throw new Error('registry '+r.status);return r.json()});
          const priority=status=>status==='Release'?0:status==='Release Android'?1:status==='Nightly'?2:3;
          const wanted=['pt-en','en-es','ja-en','en-ja'];
          const keyFor=pair=>pair.replace('-','');
          const partMap={lexicalShortlist:'lex',srcVocab:'srcvocab',trgVocab:'trgvocab'};
          const adapted={};
          for(const pair of wanted){
            const choices=(modern.models?.[pair]||[]).slice().sort((a,b)=>priority(a.releaseStatus)-priority(b.releaseStatus));
            const chosen=choices[0];
            if(!chosen)throw new Error('Missing '+pair);
            const files={};
            for(const [part,file] of Object.entries(chosen.files||{})){
              if(!file || typeof file!=='object' || !file.path) continue;
              const mapped=partMap[part]||part;
              files[mapped]={
                name:'/model-proxy/'+String(file.path).replace(/^\//,''),
                expectedSha256Hash:file.uncompressedHash||undefined,
                size:Number(file.uncompressedSize||0)||undefined
              };
            }
            if(chosen.config) files.config=chosen.config;
            adapted[keyFor(pair)]=files;
          }
          fs.writeFileSync('/tmp/bergamot-proxy/site/models.json',JSON.stringify(adapted));
          NODE
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>MLS Bergamot proxy probe</title>
          <pre id="status">starting</pre>
          <script type="module">
            import {LatencyOptimisedTranslator,TranslatorBacking} from '/bergamot/translator.js';
            window.__done=false;
            window.__probe=[];
            const options={registryUrl:'/models.json',pivotLanguage:'en',downloadTimeout:180000};
            const backing=new TranslatorBacking(options);
            const nativeFetch=backing.fetch.bind(backing);
            backing.fetch=async function(url,checksum,extra){
              if(!String(url).includes('/model-proxy/')) return nativeFetch(url,checksum,extra);
              const controller=new AbortController();
              const onAbort=()=>controller.abort();
              if(extra?.signal) extra.signal.addEventListener('abort',onAbort);
              try{
                const response=await fetch(url,{credentials:'omit',signal:controller.signal});
                if(!response.ok) throw new Error('HTTP '+response.status);
                let buffer;
                if(String(url).endsWith('.gz')){
                  if(!('DecompressionStream' in window)) throw new Error('DecompressionStream unavailable');
                  const stream=response.body.pipeThrough(new DecompressionStream('gzip'));
                  buffer=await new Response(stream).arrayBuffer();
                }else{
                  buffer=await response.arrayBuffer();
                }
                if(checksum){
                  const digest=await crypto.subtle.digest('SHA-256',buffer);
                  const actual=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
                  if(actual.toLowerCase()!==String(checksum).toLowerCase()) throw new Error('SHA256 mismatch');
                }
                return buffer;
              }finally{
                if(extra?.signal) extra.signal.removeEventListener('abort',onAbort);
              }
            };
            const translator=new LatencyOptimisedTranslator(options,backing);
            async function run(from,to,text){
              const started=performance.now();
              const response=await translator.translate({from,to,text,html:false});
              return {from,to,text:response?.target?.text||'',elapsed:Math.round(performance.now()-started)};
            }
            try{
              window.__probe.push(await run('pt','es','Eu gostaria de aprender português.'));
              window.__probe.push(await run('ja','es','日本語を勉強したいです。'));
            }catch(error){
              window.__probe.push({ok:false,error:String(error&&error.stack||error)});
            }finally{
              await translator.delete();
              document.getElementById('status').textContent=JSON.stringify(window.__probe);
              window.__done=true;
            }
          </script>
          HTML
          cat > server.mjs <<'NODE'
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          import {Readable} from 'node:stream';
          const root='/tmp/bergamot-proxy/site';
          const upstreamBase='https://storage.googleapis.com/moz-fx-translations-data--303e-prod-translations-data/';
          const types={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.json':'application/json; charset=utf-8','.wasm':'application/wasm'};
          const server=http.createServer(async(req,res)=>{
            try{
              const u=new URL(req.url,'http://127.0.0.1:8765');
              if(u.pathname.startsWith('/model-proxy/')){
                const rel=decodeURIComponent(u.pathname.slice('/model-proxy/'.length));
                if(!rel.startsWith('models/')||rel.includes('..')){res.writeHead(400);return res.end('bad path')}
                const upstream=await fetch(upstreamBase+rel);
                if(!upstream.ok){res.writeHead(upstream.status);return res.end('upstream '+upstream.status)}
                res.writeHead(200,{'content-type':'application/gzip','cache-control':'public,max-age=3600'});
                Readable.fromWeb(upstream.body).pipe(res);
                return;
              }
              let file=u.pathname==='/'?'index.html':u.pathname.replace(/^\//,'');
              file=path.join(root,file);
              if(!file.startsWith(root)||!fs.existsSync(file)||fs.statSync(file).isDirectory()){res.writeHead(404);return res.end('not found')}
              res.writeHead(200,{'content-type':types[path.extname(file)]||'application/octet-stream'});
              fs.createReadStream(file).pipe(res);
            }catch(error){res.writeHead(500);res.end(String(error))}
          });
          server.listen(8765,'127.0.0.1',()=>console.log('PROXY_READY'));
          NODE
          node server.mjs >/tmp/bergamot-proxy-http.log 2>&1 &
      - name: Translate through same-origin proxy in WebKit
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/bergamot-proxy
          node --input-type=module - <<'NODE'
          import {webkit} from 'playwright';
          const browser=await webkit.launch({headless:true});
          const page=await browser.newPage();
          page.on('console',msg=>console.log('BROWSER_CONSOLE',msg.type(),msg.text()));
          page.on('pageerror',err=>console.log('BROWSER_ERROR',String(err)));
          await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForFunction(()=>window.__done===true,null,{timeout:300000});
          const result=await page.evaluate(()=>({probe:window.__probe,decompression:'DecompressionStream' in window}));
          console.log('MLS_BERGAMOT_PROXY_RESULT',JSON.stringify(result));
          await browser.close();
          if(!result.decompression||!Array.isArray(result.probe)||result.probe.length<2||result.probe.some(x=>x.ok===false)||result.probe.some(x=>!String(x.text||'').trim()))process.exit(2);
          NODE
