name: Validate Translator T4 T5 technical rerun

on:
  push:
    branches:
      - feature/translator-pronunciation-offline
    paths:
      - ".github/workflows/validate-translator-t4-t5-technical-once.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test 'test/traductor pronunciacion.test.cjs' 'test/traductor offline.test.cjs'
      - run: npm run test:chat-editorial
      - run: npm run qa:baseline
      - run: npm run predeploy
      - name: Verify generated local translator assets
        shell: bash
        run: |
          set -euo pipefail
          test -f public/traductor.html
          test -f public/translator/offline.js
          test -f public/translator/packs.json
          test -f public/translator/registry.json
          test -f public/translator/bergamot/translator.js
          test -f public/translator/bergamot/worker/translator-worker.js
          test -f public/translator/bergamot/worker/bergamot-translator-worker.wasm
          grep -Fq 'MLS_TRANSLATOR_MODEL_PROXY_V1' src/index.js
          grep -Fq 'MLS_TRANSLATOR_ROUTE_V3' src/index.js
          grep -Fq 'mls-language-tools-r1' public/sw.js
          echo TRANSLATOR_T4_T5_TECHNICAL_OK
      - run: npm run recovery:verify
      - run: node --test test/deploy-contract.test.cjs
      - run: npm run check
