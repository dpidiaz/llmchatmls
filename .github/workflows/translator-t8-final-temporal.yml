name: Translator T8 final certification

on:
  push:
    branches:
      - feature/translator-pronunciation-offline
    paths:
      - ".github/workflows/translator-t8-final-temporal.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          other="$(find .github/workflows -maxdepth 1 -type f \( -iname '*translator*' -o -iname '*bergamot*' -o -iname '*probe*' -o -iname '*temporal*' -o -iname '*temporary*' \) ! -name 'translator-t8-final-temporal.yml' -print)"
          if [ -n "$other" ]; then
            echo "::error::Unexpected temporary Translator workflows remain:"
            printf '%s\n' "$other"
            exit 1
          fi
          content_changes="$(git diff --name-only origin/main...HEAD -- content/)"
          if [ -n "$content_changes" ]; then
            echo "::error::Canonical content changed:"
            printf '%s\n' "$content_changes"
            exit 1
          fi
          echo TRANSLATOR_REPOSITORY_HYGIENE_OK

      - run: npm ci
      - run: node --test 'test/traductor pronunciacion.test.cjs' 'test/traductor offline.test.cjs'
      - run: npm run test:chat-editorial
      - run: npm run qa:baseline
      - run: npm run predeploy

      - name: Verify final Translator artifacts and pack policy
        shell: bash
        run: |
          set -euo pipefail
          test -f public/traductor.html
          test -f public/translator/offline.js
          test -f public/translator/packs.json
          test -f public/translator/registry.json
          test -f public/translator/bergamot/worker/bergamot-translator-worker.wasm
          grep -Fq 'href="/traductor" data-nav="translator">Traductor</a>' public/index.html
          grep -Fq 'MLS_TRANSLATOR_BACKEND_V1' src/index.js
          grep -Fq 'MLS_TRANSLATOR_MODEL_PROXY_V1' src/index.js
          grep -Fq 'url.pathname === "/api/translate"' src/index.js
          grep -Fq '@cf/google/gemma-4-26b-a4b-it' src/index.js
          grep -Fq "const SLOW_RATE=0.65" public/traductor.html
          grep -Fq 'offline.canTranslateOffline' public/traductor.html
          grep -Fq 'offline.translateLocal' public/traductor.html
          grep -Fq 'mls-language-tools-r1' public/sw.js
          node - <<'NODE'
          const packs=require('./public/translator/packs.json');
          const registry=require('./public/translator/registry.json');
          const langs=Object.values(packs.languages||{});
          if(langs.length!==10)throw new Error('language pack count != 10');
          if(Object.keys(registry).length!==18)throw new Error('registry direction count != 18');
          if(packs.engine?.name!=='Bergamot')throw new Error('unexpected local engine');
          if(packs.engine?.license!=='MPL-2.0')throw new Error('unexpected engine license');
          const downloadable=langs.filter(x=>!x.runtimeOnly);
          const max=Math.max(...downloadable.map(x=>Number(x.compressedBytes||0)));
          const total=downloadable.reduce((s,x)=>s+Number(x.compressedBytes||0),0);
          if(max>80*1024*1024)throw new Error('single pack exceeds 80 MiB policy');
          if(!langs.find(x=>x.slug==='ingles'&&x.runtimeOnly===true))throw new Error('English pivot contract missing');
          console.log('TRANSLATOR_PACK_POLICY_OK',JSON.stringify({
            packVersion:packs.packVersion,
            runtimeMiB:(packs.runtimeBytes/1048576).toFixed(2),
            totalCompressedMiB:(total/1048576).toFixed(2),
            maxPackMiB:(max/1048576).toFixed(2),
            directions:Object.keys(registry).length
          }));
          NODE

      - run: npm run recovery:verify
      - run: node --test test/deploy-contract.test.cjs
      - run: npm run check

      - name: Install Chromium QA dependency
        shell: bash
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static QA server
        shell: bash
        run: |
          cat > /tmp/mls-static-server.mjs <<'NODE'
          import http from 'node:http';
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const root=path.resolve('public');
          const mime={
            '.html':'text/html; charset=utf-8',
            '.js':'text/javascript; charset=utf-8',
            '.css':'text/css; charset=utf-8',
            '.json':'application/json; charset=utf-8',
            '.webmanifest':'application/manifest+json',
            '.wasm':'application/wasm',
            '.bin':'application/octet-stream',
            '.gz':'application/gzip',
            '.svg':'image/svg+xml',
            '.png':'image/png',
            '.jpg':'image/jpeg',
            '.jpeg':'image/jpeg',
            '.ico':'image/x-icon'
          };

          const server=http.createServer(async(req,res)=>{
            try{
              const url=new URL(req.url,'http://127.0.0.1');
              let pathname=decodeURIComponent(url.pathname);
              if(pathname==='/'||pathname==='/index.html')pathname='/index.html';
              else if(pathname==='/traductor'||pathname==='/traductor/')pathname='/traductor.html';
              const file=path.resolve(root,'.'+pathname);
              if(file!==root&&!file.startsWith(root+path.sep)){
                res.statusCode=403;res.end('Forbidden');return;
              }
              const data=await fs.readFile(file);
              res.statusCode=200;
              res.setHeader('content-type',mime[path.extname(file)]||'application/octet-stream');
              res.setHeader('cache-control','no-cache');
              res.end(data);
            }catch{
              res.statusCode=404;
              res.end('Not found');
            }
          });

          server.listen(8787,'127.0.0.1',()=>console.log('STATIC_QA_READY'));
          NODE

          nohup node /tmp/mls-static-server.mjs > /tmp/mls-static.log 2>&1 &
          echo $! > /tmp/mls-static.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/traductor >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mls-static.log
          exit 1

      - name: Chromium responsive accessibility and offline shell QA
        shell: bash
        run: |
          node - <<'NODE'
          const {chromium}=await import('playwright');
          const base='http://127.0.0.1:8787';
          const widths=[320,375,390,430,768,1024,1280,1440,1920];
          const browser=await chromium.launch({headless:true});
          const issues=[];
          for(const width of widths){
            const context=await browser.newContext({viewport:{width,height:900}});
            const page=await context.newPage();
            await page.goto(base+'/traductor?lang=portugues',{waitUntil:'networkidle'});
            const state=await page.evaluate(()=>{
              const target=document.getElementById('targetLanguage');
              const overflow=document.documentElement.scrollWidth-document.documentElement.clientWidth;
              const visibles=[...document.querySelectorAll('button,a,select,textarea')]
                .filter(el=>{
                  const r=el.getBoundingClientRect();
                  const s=getComputedStyle(el);
                  return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none';
                })
                .map(el=>({tag:el.tagName,text:(el.textContent||el.getAttribute('aria-label')||'').trim(),h:el.getBoundingClientRect().height}));
              return {target:target&&target.value,overflow,small:visibles.filter(x=>x.h<43.5)};
            });
            if(state.target!=='portugues')issues.push({width,issue:'context language not selected',state});
            if(state.overflow>1)issues.push({width,issue:'horizontal overflow',overflow:state.overflow});
            const small=state.small.filter(x=>x.tag!=='TEXTAREA');
            if(width<=430&&small.length)issues.push({width,issue:'small interactive targets',small});
            await page.keyboard.press('Tab');
            const firstFocus=await page.evaluate(()=>document.activeElement&&document.activeElement.textContent.trim());
            if(firstFocus!=='Saltar al Traductor')issues.push({width,issue:'skip link is not first focus',firstFocus});
            await page.getByRole('tab',{name:'Pronunciar'}).click();
            await page.locator('#pronounceInput').fill('não se preocupe');
            await page.getByRole('button',{name:'Preparar pronunciación'}).click();
            if(await page.locator('#pronunciationResult').isHidden())issues.push({width,issue:'pronunciation result stayed hidden'});
            await context.close();
          }

          for(const [label,width] of [['200%',640],['400%',320]]){
            const context=await browser.newContext({viewport:{width,height:900}});
            const page=await context.newPage();
            await page.goto(base+'/traductor',{waitUntil:'networkidle'});
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
            if(overflow>1)issues.push({label,issue:'reflow horizontal overflow',overflow});
            await context.close();
          }

          const context=await browser.newContext({viewport:{width:390,height:844}});
          const page=await context.newPage();
          await page.goto(base+'/',{waitUntil:'networkidle'});
          await page.evaluate(async()=>{
            if(!('serviceWorker' in navigator))throw new Error('serviceWorker unsupported in Chromium QA');
            await navigator.serviceWorker.ready;
          });
          await page.goto(base+'/traductor',{waitUntil:'networkidle'});
          await context.setOffline(true);
          let offlineOk=true;
          try{await page.reload({waitUntil:'domcontentloaded',timeout:15000})}catch{offlineOk=false}
          if(!offlineOk)issues.push({width:390,issue:'Translator App Shell did not reload offline'});
          else{
            const title=await page.title();
            if(!title.includes('Traductor'))issues.push({width:390,issue:'offline page is not Translator',title});
          }
          await context.close();
          await browser.close();
          console.log('TRANSLATOR_CHROMIUM_QA',JSON.stringify({viewports:widths,reflow:['200% proxy','400% proxy'],issues}));
          if(issues.length)process.exit(1);
          NODE

      - name: Final status
        run: echo TRANSLATOR_T8_TECHNICAL_CERTIFICATION_OK
