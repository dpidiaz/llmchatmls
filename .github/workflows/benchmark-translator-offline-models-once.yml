name: Benchmark Translator offline model metadata once

on:
  push:
    branches:
      - feature/translator-pronunciation-offline
    paths:
      - ".github/workflows/benchmark-translator-offline-models-once.yml"

permissions:
  contents: read

jobs:
  benchmark-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect current Mozilla translation model registry
        shell: bash
        run: |
          node - <<'NODE'
          const registryUrl='https://storage.googleapis.com/moz-fx-translations-data--303e-prod-translations-data/db/models.json';
          const registry=await fetch(registryUrl).then(r=>{if(!r.ok)throw new Error('registry '+r.status);return r.json()});
          const wanted=['es','pt','it','fr','de','ja','zh','ko','ru'];
          const priority=status=>status==='Release'?0:status==='Release Android'?1:status==='Nightly'?2:3;
          async function sizeForFile(baseUrl,file){
            if(!file?.path)return 0;
            const url=baseUrl.replace(/\/$/,'')+'/'+file.path.replace(/^\//,'');
            const head=await fetch(url,{method:'HEAD'});
            if(head.ok){
              const n=Number(head.headers.get('content-length')||0);
              if(Number.isFinite(n)&&n>0)return n;
            }
            const get=await fetch(url,{headers:{Range:'bytes=0-0'}});
            const range=get.headers.get('content-range')||'';
            const m=range.match(/\/(\d+)$/);
            try{await get.body?.cancel()}catch{}
            return m?Number(m[1]):Number(get.headers.get('content-length')||0);
          }
          async function summarize(pair){
            const all=(registry.models?.[pair]||[]).slice().sort((a,b)=>priority(a.releaseStatus)-priority(b.releaseStatus));
            const chosen=all[0];
            if(!chosen)return {pair,available:false};
            let bytes=0;
            const fileSizes={};
            for(const [name,file] of Object.entries(chosen.files||{})){
              const size=await sizeForFile(registry.baseUrl,file);
              fileSizes[name]=size;
              bytes+=size;
            }
            return {
              pair,available:true,releaseStatus:chosen.releaseStatus||null,architecture:chosen.architecture,
              compressedBytes:bytes,compressedMiB:Number((bytes/1048576).toFixed(2)),
              modelUncompressedMiB:Number(((chosen.files?.model?.uncompressedSize||0)/1048576).toFixed(2)),
              fileSizes
            };
          }
          const rows=[];
          for(const lang of wanted){
            rows.push(await summarize(lang+'-en'));
            rows.push(await summarize('en-'+lang));
          }
          console.log('MODEL_REGISTRY_GENERATED',registry.generated);
          console.log('MLS_OFFLINE_MODEL_METADATA',JSON.stringify(rows,null,2));
          const complete=wanted.filter(lang=>(registry.models?.[lang+'-en']||[]).length&&(registry.models?.['en-'+lang]||[]).length);
          console.log('BIDIRECTIONAL_VIA_EN',JSON.stringify(complete));
          NODE
