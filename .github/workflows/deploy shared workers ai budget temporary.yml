name: Temporary shared Workers AI budget production deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/deploy-shared-workers-ai-budget-trigger'

permissions:
  contents: read

jobs:
  verify-deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:chat-editorial
      - run: npm run predeploy
      - run: npm run recovery:verify
      - run: node --test test/deploy-contract.test.cjs
      - run: npm run check
      - name: Desplegar en produccion
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke presupuesto compartido con búsqueda semántica
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/semantic.json"
          code=$(curl --silent --show-error             --output "$tmp" --write-out '%{http_code}'             -X POST 'https://llmchatmls.dpidiaz.workers.dev/api/search/embedding'             -H 'content-type: application/json'             --data '{"query":"verbos"}')
          body=$(cat "$tmp")
          printf '%s\n' "$body"
          if [ "$code" = "200" ]; then
            node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok||x.model!=="@cf/baai/bge-m3"||!Array.isArray(x.vector)||!x.vector.length) process.exit(1)' "$body"
          elif [ "$code" = "429" ] || [ "$code" = "503" ]; then
            echo 'Semantic AI unavailable/quota protected; graceful path accepted.'
          else
            exit 1
          fi
      - name: Sincronizar credenciales D1 Analytics
        shell: bash
        run: |
          if [ -n "$D1_ANALYTICS_TOKEN" ] && [ -n "$D1_ANALYTICS_ACCOUNT_ID" ]; then
            printf '%s' "$D1_ANALYTICS_TOKEN" | npx wrangler secret put D1_ANALYTICS_TOKEN
            printf '%s' "$D1_ANALYTICS_ACCOUNT_ID" | npx wrangler secret put D1_ANALYTICS_ACCOUNT_ID
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ANALYTICS_TOKEN: ${{ secrets.D1_ANALYTICS_TOKEN }}
          D1_ANALYTICS_ACCOUNT_ID: ${{ secrets.D1_ANALYTICS_ACCOUNT_ID }}
      - name: Crear snapshot MLS Staging del deploy
        shell: bash
        run: |
          set +e
          http_status=$(curl --silent --show-error --output "$RUNNER_TEMP/mlsstagingsnapshot.json" --write-out '%{http_code}' -X POST 'https://llmchatmls.dpidiaz.workers.dev/api/wiki/editorial/staging/snapshot' -H "Authorization: Bearer $MLS_EDITORIAL_CHAT_KEY" -H 'Content-Type: application/json' --data "{\"sourceCommit\":\"$GITHUB_SHA\"}")
          curl_status=$?
          set -e
          body=$(cat "$RUNNER_TEMP/mlsstagingsnapshot.json" 2>/dev/null || true)
          if [ "$curl_status" -ne 0 ]; then printf '%s\n' "$body"; exit "$curl_status"; fi
          if [ "$http_status" = "200" ]; then printf '%s\n' "$body"; exit 0; fi
          if [ "$http_status" = "503" ] && printf '%s' "$body" | grep -Eqi "credenciales GitHub configuradas|daily row (read|write) limit"; then
            printf '%s\n' "$body"; echo '::warning::Snapshot diferido; producción quedó desplegada.'; exit 0
          fi
          printf '%s\n' "$body"; exit 1
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
      - name: Verificar Action editorial sin crear lotes
        run: node scripts/verify-chat-deployment.cjs
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
