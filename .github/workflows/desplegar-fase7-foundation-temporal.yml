name: Desplegar Fase 7 foundation temporal

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desplegar-fase7-foundation-temporal.yml"

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Suite MLS
        run: npm run test:chat-editorial
      - name: Construir sin índice semántico
        run: npm run predeploy
      - name: Contrato
        run: node --test test/deploy-contract.test.cjs
      - name: Dry run
        run: npm run check
      - name: Desplegar foundation semántica
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verificar foundation sin consumir Workers AI
        shell: bash
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'
          for i in 1 2 3 4 5 6 7 8; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base/data/semantic/manifest.json")
            if [ "$status" = "404" ]; then break; fi
            sleep 3
          done
          if [ "$status" != "404" ]; then
            echo "::error::Semantic manifest should not be published yet; HTTP $status"
            exit 1
          fi
          echo 'semantic manifest absent as expected'

          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base/api/search/embedding")
          if [ "$status" != "405" ]; then
            echo "::error::Embedding endpoint GET should be 405 without inference; HTTP $status"
            exit 1
          fi
          echo 'embedding endpoint exists without inference'

          curl --fail --silent --show-error "$base/js/search.js" -o search.js
          grep -q 'data/semantic/manifest.json' search.js
          grep -q 'if(response.status===404)return null' search.js
          grep -q 'const semanticSlugs=manifest?' search.js
          grep -q 'Búsqueda inteligente: contenido completo + significado' search.js
          echo 'semantic client is manifest-gated'
