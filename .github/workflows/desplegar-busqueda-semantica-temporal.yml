name: Desplegar búsqueda semántica MLS una vez

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desplegar-busqueda-semantica-temporal.yml"

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Construir MLS con índice semántico
        run: npm run predeploy

      - name: Verificar publicación semántica antes del deploy
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const health=JSON.parse(fs.readFileSync('public/data/semantic/publish-health.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('public/data/semantic/manifest.json','utf8'));
          if(!health.ok||health.model!=='@cf/baai/bge-m3'||health.totalEntries!==10133||health.totalChunks!==10669) throw new Error('publish-health semántico inválido');
          if(manifest.totalEntries!==10133||manifest.totalChunks!==10669||Object.keys(manifest.languages||{}).length!==10) throw new Error('manifest semántico inválido');
          console.log('SEMANTIC_BUILD_OK',JSON.stringify({entries:manifest.totalEntries,chunks:manifest.totalChunks,bytes:manifest.totalBytes,languages:Object.keys(manifest.languages).length}));
          NODE

      - name: Dry run Cloudflare
        run: npm run check

      - name: Desplegar búsqueda semántica
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verificar producción semántica extremo a extremo
        shell: bash
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'

          fetch_retry() {
            local url="$1"
            local out="$2"
            for i in 1 2 3 4 5 6 7 8; do
              if curl --fail --silent --show-error "$url" -o "$out"; then return 0; fi
              sleep 3
            done
            return 1
          }

          fetch_retry "$base/data/semantic/publish-health.json" semantic-health.json
          fetch_retry "$base/data/semantic/manifest.json" semantic-manifest.json
          fetch_retry "$base/data/semantic/portugues.json" portugues.json
          fetch_retry "$base/data/semantic/portugues.bin" portugues.bin
          fetch_retry "$base/js/search.js" search.js

          node - <<'NODE'
          const fs=require('node:fs');
          const health=JSON.parse(fs.readFileSync('semantic-health.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('semantic-manifest.json','utf8'));
          const meta=JSON.parse(fs.readFileSync('portugues.json','utf8'));
          const bin=fs.readFileSync('portugues.bin');
          if(!health.ok||health.standard!=='MLS R32'||health.promptVersion!=='32.0'||health.model!=='@cf/baai/bge-m3')throw new Error('health semántico inválido');
          if(health.totalEntries!==10133||health.totalChunks!==10669||health.totalBytes!==10967732)throw new Error('totales semánticos inesperados');
          if(Object.keys(manifest.languages||{}).length!==10)throw new Error('manifest no contiene diez idiomas');
          if(meta.language!=='portugues'||meta.totalEntries!==1199||meta.totalChunks!==1199||meta.dimensions!==1024)throw new Error('metadata portuguesa inválida');
          if(bin.length!==meta.totalChunks*meta.recordBytes)throw new Error('binario portugués incompatible');
          const search=fs.readFileSync('search.js','utf8');
          if(!search.includes('MLS SEMANTIC HYBRID SEARCH 1.0'))throw new Error('search.js no contiene motor semántico');
          if(!search.includes("const slugs=lang?[lang]:MLS_META.map(m=>m.slug)"))throw new Error('search.js perdió filtro por idioma antes del ranking');
          console.log('SEMANTIC_ASSETS_PRODUCTION_OK');
          NODE

          status=$(curl --silent --show-error --output query-vector.json --write-out '%{http_code}'             -X POST "$base/api/search/embedding"             -H 'content-type: application/json'             --data '{"query":"ações que se repetem desde algum tempo"}')
          if [ "$status" != "200" ]; then
            echo "::error::Embedding endpoint devolvió HTTP $status"
            cat query-vector.json || true
            exit 1
          fi

          node - <<'NODE'
          const fs=require('node:fs');
          const q=JSON.parse(fs.readFileSync('query-vector.json','utf8'));
          const meta=JSON.parse(fs.readFileSync('portugues.json','utf8'));
          const bin=fs.readFileSync('portugues.bin');
          if(!q.ok||q.model!=='@cf/baai/bge-m3'||q.dimensions!==1024||!Array.isArray(q.vector)||q.vector.length!==1024)throw new Error('embedding de consulta inválido');
          const best=[];
          for(let i=0;i<meta.chunks.length;i++){
            const offset=i*meta.recordBytes;
            const scale=bin.readFloatLE(offset);
            let score=0;
            for(let d=0;d<meta.dimensions;d++)score+=bin.readInt8(offset+4+d)*scale*q.vector[d];
            const item={score,code:meta.chunks[i].code,title:meta.chunks[i].title,section:meta.chunks[i].section};
            if(best.length<10){best.push(item);best.sort((a,b)=>b.score-a.score)}
            else if(score>best[best.length-1].score){best[best.length-1]=item;best.sort((a,b)=>b.score-a.score)}
          }
          if(best.length!==10||best.some(x=>!x.code.startsWith('MLS-V02-')))throw new Error('ranking semántico fuera del corpus portugués');
          if(!best.every(x=>Number.isFinite(x.score)))throw new Error('scores semánticos inválidos');
          console.log('SEMANTIC_QUERY_TOP10 '+JSON.stringify(best));
          NODE

          echo 'SEMANTIC_END_TO_END_OK'

# retry after valid publish-health JSON
