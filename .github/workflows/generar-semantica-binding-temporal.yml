name: Generar índice semántico vía binding una vez

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generar-semantica-binding-temporal.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout endpoint temporal
        uses: actions/checkout@v4
        with:
          ref: mls-semantic-batch-endpoint-temp
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Preparar clave efímera e inyectar digest
        shell: bash
        run: |
          set -euo pipefail
          key=$(openssl rand -hex 32)
          digest=$(printf '%s' "$key" | sha256sum | awk '{print $1}')
          echo "::add-mask::$key"
          echo "MLS_SEMANTIC_GENERATION_KEY=$key" >> "$GITHUB_ENV"
          echo "MLS_SEMANTIC_GENERATION_DIGEST=$digest" >> "$GITHUB_ENV"
          node - "$digest" <<'NODE'
          const fs=require('node:fs');
          const digest=process.argv[2];
          const file='MLS R32 OVERLAY/index.js';
          let source=fs.readFileSync(file,'utf8');
          const marker='__SEMANTIC_GENERATION_KEY_SHA256__';
          if(!source.includes(marker))throw new Error('No se encontró placeholder del digest semántico temporal.');
          source=source.replaceAll(marker,digest);
          fs.writeFileSync(file,source,'utf8');
          NODE

      - name: Desplegar endpoint batch temporal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npm ci
          npm run predeploy
          if grep -q '__SEMANTIC_GENERATION_KEY_SHA256__' src/index.js; then
            echo "::error::El placeholder del digest sobrevivió al predeploy"
            exit 1
          fi
          npm run check
          npm run deploy

      - name: Probar endpoint protegido
        shell: bash
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'
          for i in 1 2 3 4 5 6 7 8; do
            status=$(curl --silent --show-error --output /tmp/batch.json --write-out '%{http_code}'               -X POST "$base/api/internal/semantic-batch"               -H "authorization: Bearer $MLS_SEMANTIC_GENERATION_KEY"               -H 'content-type: application/json'               --data '{"texts":["prueba semántica protegida","segunda prueba"]}')
            if [ "$status" = "200" ]; then break; fi
            sleep 3
          done
          cat /tmp/batch.json
          test "$status" = "200"
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('/tmp/batch.json','utf8'));
          if(!p.ok||p.model!=='@cf/baai/bge-m3'||p.count!==2||!Array.isArray(p.vectors)||p.vectors.length!==2)throw new Error('Batch embedding inválido.');
          if(!p.vectors.every(v=>Array.isArray(v)&&v.length===p.dimensions&&v.length>100))throw new Error('Dimensiones inválidas.');
          console.log('TEMP_BATCH_ENDPOINT_OK dimensions='+p.dimensions);
          NODE

          bad=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}'             -X POST "$base/api/internal/semantic-batch"             -H 'authorization: Bearer incorrecta'             -H 'content-type: application/json'             --data '{"texts":["no autorizado"]}')
          test "$bad" = "404"
          echo "TEMP_BATCH_AUTH_GUARD_OK"

      - name: Checkout rama de generación
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fd
          git fetch origin mls-semantic-index-generation
          git checkout -B mls-semantic-index-generation origin/mls-semantic-index-generation
          git config user.name "MLS Semantic Index Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Generar 10 idiomas con checkpoints
        env:
          MLS_EMBEDDING_ENDPOINT: https://llmchatmls.dpidiaz.workers.dev/api/internal/semantic-batch
          MLS_EMBEDDING_KEY: ${{ env.MLS_SEMANTIC_GENERATION_KEY }}
          MLS_SEMANTIC_BATCH_SIZE: "32"
        shell: bash
        run: |
          set -euo pipefail
          languages=(
            ingles
            portugues
            italiano
            frances
            aleman
            japones
            chino-taiwan
            coreano
            ruso
            espanol-guatemala
          )
          for lang in "${languages[@]}"; do
            echo "===== SEMANTIC START $lang ====="
            node "scripts/generar indice semantico.js" --language "$lang"
            git add "semantic/$lang.json" "semantic/$lang.bin"
            if ! git diff --cached --quiet; then
              git commit -m "Generate semantic index for $lang"
              git push origin HEAD:mls-semantic-index-generation
            fi
            echo "===== SEMANTIC DONE $lang ====="
          done

      - name: Construir manifest y validar índice completo
        env:
          MLS_EMBEDDING_ENDPOINT: https://llmchatmls.dpidiaz.workers.dev/api/internal/semantic-batch
          MLS_EMBEDDING_KEY: ${{ env.MLS_SEMANTIC_GENERATION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {buildManifest}=require('./scripts/generar indice semantico.js');
          const {validateSemanticSource}=require('./scripts/publicar indice semantico.js');
          const manifest=buildManifest();
          if(!manifest)throw new Error('Manifest semántico incompleto.');
          const result=validateSemanticSource();
          if(!result.complete||result.totalEntries!==10133)throw new Error('Validación incompleta: '+JSON.stringify(result));
          console.log('SEMANTIC_COMPLETE '+JSON.stringify({
            totalEntries:result.totalEntries,
            totalChunks:result.totalChunks,
            totalBytes:result.totalBytes,
            model:manifest.model,
            corpusBuildId:manifest.corpusBuildId
          }));
          NODE
          git add semantic/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Complete MLS semantic index manifest"
            git push origin HEAD:mls-semantic-index-generation
          fi

      - name: Restaurar Worker normal sin endpoint temporal
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fd
          git fetch origin main
          git checkout -B main origin/main
          npm ci
          npm run predeploy
          npm run check
          npm run deploy

      - name: Resumen de generación
        if: always()
        shell: bash
        run: |
          set +e
          git fetch origin mls-semantic-index-generation
          git log --oneline -15 origin/mls-semantic-index-generation
