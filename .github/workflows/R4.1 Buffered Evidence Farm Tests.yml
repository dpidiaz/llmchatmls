name: R4.1 Buffered Evidence Farm Tests

on:
  pull_request:
    paths:
      - 'MLS R32 EDITORIAL/r4 buffered **'
      - 'scripts/R4-1-buffered-farm.cjs'
      - 'scripts/R4-1-buffered-remote.cjs'
      - 'scripts/R4-1-buffered-academic-check.cjs'
      - 'scripts/R4-1-revision-stage-certify.cjs'
      - 'docs/MLS Global Dispatcher/13 R4.1 Piloto 1861 staged revision v3.json'
      - 'MLS R32 EDITORIAL/r4 buffered academic.cjs'
      - 'MLS R32 EDITORIAL/evidence git/quality-holds.json'
      - 'scripts/R4 final publication readiness.cjs'
      - 'docs/MLS Global Dispatcher/11 R4.1 Auditoria piloto 1861.md'
      - '.github/workflows/R4.1 Buffered Sync.yml'
      - 'scripts/MLS global dispatcher scheduler.cjs'
      - 'scripts/MLS global dispatcher worker.cjs'
      - 'MLS R32 EDITORIAL/global dispatcher/providers/**'
      - '.github/workflows/MLS Global Dispatcher Scheduler.yml'
      - 'test/r4 buffered *.test.cjs'
      - 'docs/MLS Global Dispatcher/10 R4.1 Buffered Evidence Farm.md'
      - '.github/workflows/R4.1 Buffered Evidence Farm Tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  buffered-farm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax validation
        run: |
          node --check 'MLS R32 EDITORIAL/r4 buffered core.cjs'
          node --check 'MLS R32 EDITORIAL/r4 buffered academic.cjs'
          node --check 'scripts/R4-1-buffered-academic-check.cjs'
          node --check 'scripts/R4 final publication readiness.cjs'
          node --check 'MLS R32 EDITORIAL/r4 buffered sync.cjs'
          node --check 'MLS R32 EDITORIAL/r4 buffered allocation.cjs'
          node --check 'MLS R32 EDITORIAL/r4 buffered transport.cjs'
          node --check 'MLS R32 EDITORIAL/r4 buffered verify.cjs'
          node --check 'MLS R32 EDITORIAL/r4 buffered remote.cjs'
          node --check 'MLS R32 EDITORIAL/r4 buffered finalize.cjs'
          node --check 'scripts/R4-1-buffered-remote.cjs'
          node --check 'scripts/MLS global dispatcher scheduler.cjs'
          node --check 'scripts/MLS global dispatcher worker.cjs'
          node --check 'scripts/R4-1-buffered-farm.cjs'
          node --check 'scripts/R4-1-revision-stage-certify.cjs'
      - name: Buffered Farm transport and safety tests
        run: node --test 'test/r4 buffered farm.test.cjs' 'test/r4 buffered allocation.test.cjs' 'test/r4 buffered transport and sync.test.cjs' 'test/r4 buffered scheduler integration.test.cjs' 'test/r4 buffered workflow contract.test.cjs'
      - name: R4.1 academic traceability and final publication hold
        run: node --test 'test/r4 buffered academic gate.test.cjs'
      - name: Ten versioned source-located correction checks for #1861
        run: node --test 'test/r4 buffered pilot 1861 v3.test.cjs'
      - name: Offline academic pilot with ten already VERIFIED canonical Evidence entries
        run: node --test 'test/r4 buffered real evidence pilot.test.cjs'
      - name: Immutable revision stage and collision tests
        run: node --test 'test/r4 buffered revision stage 1861.test.cjs'
      - name: Live, read-only original Dispatcher ledger reconciliation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: dpidiaz/llmchatmls
        run: node scripts/R4-1-revision-stage-certify.cjs
      - name: Existing R33 provider regression
        run: node --test 'test/mls global dispatcher provider r33.test.cjs' 'test/evidence certification contract.test.cjs'
