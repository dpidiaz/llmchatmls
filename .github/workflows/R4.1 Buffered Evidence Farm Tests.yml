name: R4.1 Buffered Evidence Farm Tests

on:
  pull_request:
    paths:
      - 'MLS R32 EDITORIAL/r4 buffered **'
      - 'scripts/R4-1-buffered-farm.cjs'
      - 'scripts/R4-1-buffered-remote.cjs'
      - 'scripts/R4-1-buffered-academic-check.cjs'
      - 'scripts/R4-1-bcr.cjs'
      - 'MLS R32 EDITORIAL/r4 elastic *.cjs'
      - 'MLS R32 EDITORIAL/r4 universal scheduler.cjs'
      - 'test/r4 universal bcr.test.cjs'
      - 'docs/MLS Global Dispatcher/19 Comando universal BCR.md'
      - 'test/r4 elastic bcr.test.cjs'
      - 'docs/MLS Global Dispatcher/18 R4.2 Elastic BCR.md'
      - 'scripts/R4-1-bcr-canonical-gate.cjs'
      - 'MLS R32 EDITORIAL/r4 buffered context.cjs'
      - 'test/r4 buffered bcr.test.cjs'
      - 'docs/MLS Global Dispatcher/17 R4.1 BCR v1.md'
      - 'scripts/R4 staging rehearsal.cjs'
      - 'MLS R32 EDITORIAL/r4 staging supersession.cjs'
      - 'MLS R32 EDITORIAL/evidence git/staging-supersessions.json'
      - 'docs/MLS Global Dispatcher/14 R4.1 Piloto 1861 revision bibliografica independiente.md'
      - 'test/r4 staging supersession.test.cjs'
      - 'test/r4 pilot scale gate.test.cjs'
      - 'docs/MLS Global Dispatcher/15 R4.1 AI only evidence protocol.md'
      - 'docs/MLS Global Dispatcher/16 R4.1 AI verification release 1861.md'
      - 'MLS R32 EDITORIAL/r4 buffered academic.cjs'
      - 'MLS R32 EDITORIAL/evidence git/quality-holds.json'
      - 'scripts/R4 final publication readiness.cjs'
      - 'docs/MLS Global Dispatcher/11 R4.1 Auditoria piloto 1861.md'
      - '.github/workflows/R4.1 Buffered Sync.yml'
      - 'scripts/MLS global dispatcher scheduler.cjs'
      - 'scripts/MLS global dispatcher worker.cjs'
      - 'MLS R32 EDITORIAL/global dispatcher/providers/**'
      - '.github/workflows/MLS Global Dispatcher Scheduler.yml'
      - 'test/r4 buffered *.test.cjs'
      - 'docs/MLS Global Dispatcher/10 R4.1 Buffered Evidence Farm.md'
      - '.github/workflows/R4.1 Buffered Evidence Farm Tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buffered-farm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax validation
        run: |
          node --check 'MLS R32 EDITORIAL/r4 buffered core.cjs'
          node --check 'MLS R32 EDITORIAL/r4 elastic core.cjs'
          node --check 'MLS R32 EDITORIAL/r4 elastic scheduler.cjs'
          node --check 'MLS R32 EDITORIAL/r4 buffered academic.cjs'
          node --check 'scripts/R4-1-buffered-academic-check.cjs'
          node --check 'MLS R32 EDITORIAL/r4 buffered context.cjs'
          node --check 'scripts/R4-1-bcr.cjs'
          node --check 'scripts/R4-1-bcr-canonical-gate.cjs'
          node --check 'scripts/R4 final publication readiness.cjs'
          node --check 'MLS R32 EDITORIAL/r4 buffered sync.cjs'
          node --check 'MLS R32 EDITORIAL/r4 buffered allocation.cjs'
          node --check 'MLS R32 EDITORIAL/r4 buffered transport.cjs'
          node --check 'MLS R32 EDITORIAL/r4 buffered verify.cjs'
          node --check 'MLS R32 EDITORIAL/r4 buffered remote.cjs'
          node --check 'MLS R32 EDITORIAL/r4 buffered finalize.cjs'
          node --check 'scripts/R4-1-buffered-remote.cjs'
          node --check 'scripts/MLS global dispatcher scheduler.cjs'
          node --check 'scripts/MLS global dispatcher worker.cjs'
          node --check 'scripts/R4-1-buffered-farm.cjs'
      - name: Buffered Farm transport and safety tests
        run: node --test 'test/r4 buffered farm.test.cjs' 'test/r4 buffered allocation.test.cjs' 'test/r4 buffered transport and sync.test.cjs' 'test/r4 buffered scheduler integration.test.cjs' 'test/r4 buffered workflow contract.test.cjs'
      - name: BCR 14-case compact context and recovery contract
        run: node --test 'test/r4 buffered bcr.test.cjs'
      - name: R4.2 elastic disposable chat workers, isolation, queue and recovery
        run: node --test 'test/r4 elastic bcr.test.cjs' 'test/r4 universal bcr.test.cjs'
      - name: R4.1 academic traceability and final publication hold
        run: node --test 'test/r4 buffered academic gate.test.cjs'
      - name: Offline academic pilot with ten already VERIFIED canonical Evidence entries
        run: node --test 'test/r4 buffered real evidence pilot.test.cjs'
      - name: AI-source-verified, SHA-pinned Gate 25 (no human attestation)
        run: node --test 'test/r4 pilot scale gate.test.cjs'
      - name: Pinned revision staging, academic hold and no historical fallback
        run: node --test 'test/r4 staging supersession.test.cjs'
      - name: Existing R33 provider regression
        run: node --test 'test/mls global dispatcher provider r33.test.cjs' 'test/evidence certification contract.test.cjs'

  canonical-gate-1872:
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/r41-1872-canonical-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover pinned buffer without mutating canonical content
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/r41/buffer/1872:refs/remotes/origin/r41-bcr-1872'
          pin='8c612b789d117c8cfecfd5e835b1227543cda546'
          test "$(git rev-parse refs/remotes/origin/r41-bcr-1872)" = "$pin"
          mkdir -p "$RUNNER_TEMP/r41-gate-1872"
          git archive "$pin" r41-buffer/1872 | tar -xf - -C "$RUNNER_TEMP/r41-gate-1872"
          test ! -e "$RUNNER_TEMP/r41-gate-1872/r41-buffer/1872/package.json"
      - name: ACTUAL canonical R33 and academic R4.1 on all 25
        shell: bash
        env:
          MLS_BCR_GATE_REPORT: /tmp/r41-1872-canonical-report.json
        run: |
          set -euo pipefail
          node --check scripts/R4-1-bcr-canonical-gate.cjs
          node scripts/R4-1-bcr-canonical-gate.cjs . \
            "$RUNNER_TEMP/r41-gate-1872/r41-buffer/1872" \
            8c612b789d117c8cfecfd5e835b1227543cda546
      - name: Preserve gate report whether PASS or blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mls-1872-r33-r41-gate
          path: /tmp/r41-1872-canonical-report.json
          if-no-files-found: warn
          retention-days: 30


  canonical-seal-candidate-1872:
    # This PR-only job cannot publish a package, SYNC or modify production.
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/r41-1872-seal-candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract exact unsealed snapshot into temporary runner directory
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/r41/buffer/1872:refs/remotes/origin/r41-bcr-1872'
          pin='8c612b789d117c8cfecfd5e835b1227543cda546'
          test "$(git rev-parse refs/remotes/origin/r41-bcr-1872)" = "$pin"
          mkdir -p "$RUNNER_TEMP/r41-seal-1872"
          git archive "$pin" r41-buffer/1872 | tar -xf - -C "$RUNNER_TEMP/r41-seal-1872"
          test ! -e "$RUNNER_TEMP/r41-seal-1872/r41-buffer/1872/package.json"
      - name: Execute actual canonical seal and validate portable bundle in temporary checkout
        shell: bash
        env:
          MLS_SEAL_CANDIDATE_OUTPUT: /tmp/r41-1872-seal-candidate.json
        run: |
          set -euo pipefail
          node --check scripts/R4-1-bcr-seal-candidate.cjs
          node scripts/R4-1-bcr-seal-candidate.cjs . \
            "$RUNNER_TEMP/r41-seal-1872/r41-buffer/1872"
          test -s /tmp/r41-1872-seal-candidate.json
          test "$(git rev-parse refs/remotes/origin/r41-bcr-1872)" = \
            '8c612b789d117c8cfecfd5e835b1227543cda546'
      - name: Retain temporary seal candidate for audit, not a publication
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mls-1872-seal-candidate-not-published
          path: /tmp/r41-1872-seal-candidate.json
          retention-days: 30
