name: UXUI R1 F checkpoint verify

on:
  push:
    branches:
      - uxui-r1-ai-experience
    paths:
      - ".github/workflows/uxui-r1-f-checkpoint.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: F tests
        run: node --test 'test/virtuoso v1.test.cjs' 'test/profesor ia ux.test.cjs' 'test/profesor ia estados visuales.test.cjs' 'test/visual system.test.cjs'
      - name: Build
        run: npm run predeploy
      - name: Recovery
        run: npm run recovery:verify
      - name: Dry run
        run: npm run check
