name: QA G baseline temporal

on:
  push:
    branches:
      - uxui-r1-accessibility
    paths:
      - ".github/workflows/qa-g-baseline-temporal.yml"

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ejecutar baseline G
        run: npm run qa:baseline
      - name: Probar contrato baseline
        run: node --test 'test/accessibility responsive baseline.test.cjs'
