name: Descubrir Workers AI analytics temporal

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/descubrir-workers-ai-analytics-temporal.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Introspeccionar aiInferenceAdaptiveGroups
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const query=`
            query SemanticAiSchema {
              filter: __type(name: "AccountAiInferenceAdaptiveGroupsFilter_InputObject") {
                inputFields { name type { kind name ofType { kind name } } }
              }
              dims: __type(name: "AccountAiInferenceAdaptiveGroupsDimensions") {
                fields { name type { kind name ofType { kind name } } }
              }
              group: __type(name: "AccountAiInferenceAdaptiveGroups") {
                fields { name type { kind name ofType { kind name } } }
              }
              sum: __type(name: "AccountAiInferenceAdaptiveGroupsSum") {
                fields { name type { kind name ofType { kind name } } }
              }
            }`;
          const response=await fetch('https://api.cloudflare.com/client/v4/graphql',{
            method:'POST',
            headers:{authorization:'Bearer '+token,'content-type':'application/json',accept:'application/json'},
            body:JSON.stringify({query})
          });
          const payload=await response.json().catch(()=>({}));
          console.log('graphql_http_status='+response.status);
          if(!response.ok||payload?.errors?.length){
            console.log('graphql_errors='+JSON.stringify(payload?.errors||payload));
            process.exit(62);
          }
          console.log('AI_INFERENCE_SCHEMA '+JSON.stringify(payload.data));
          NODE
