name: Probe Bergamot WebKit feasibility once

on:
  push:
    branches:
      - feature/translator-pronunciation-offline
    paths:
      - ".github/workflows/probe-bergamot-webkit-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect Bergamot npm artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bergamot-probe
          cd /tmp/bergamot-probe
          npm pack @browsermt/bergamot-translator@0.4.9 --json > pack.json
          node - <<'NODE'
          const p=require('/tmp/bergamot-probe/pack.json')[0];
          console.log('BERGAMOT_PACKAGE',JSON.stringify({
            name:p.name,version:p.version,size:p.size,unpackedSize:p.unpackedSize,
            files:p.files.map(f=>({path:f.path,size:f.size})).filter(f=>/translator|worker|wasm|gemm|package\.json$/.test(f.path))
          },null,2));
          NODE
      - name: Probe package API under Node import
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/bergamot-probe
          tar -xzf browsermt-bergamot-translator-0.4.9.tgz
          node --input-type=module - <<'NODE'
          const mod=await import('file:///tmp/bergamot-probe/package/translator.js');
          console.log('BERGAMOT_EXPORTS',Object.keys(mod).sort().join(','));
          if(typeof mod.LatencyOptimisedTranslator!=='function')throw new Error('LatencyOptimisedTranslator export missing');
          NODE
