name: Temporary Translator neuron budget validation

on:
  push:
    branches:
      - feature/translator-neuron-budget
    paths:
      - '.github/validate-translator-neuron-budget-trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test 'test/traductor pronunciacion.test.cjs' 'test/traductor offline.test.cjs'
      - run: npm run test:chat-editorial
      - run: npm run predeploy
      - run: npm run recovery:verify
      - run: node --test test/deploy-contract.test.cjs
      - run: npm run check
