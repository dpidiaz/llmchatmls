name: Deploy contextual language search once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-contextual-language-search-once.yml"

permissions:
  contents: read

jobs:
  verify-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify intended hotfix parent
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "0bbce6b923f5664164877e2e36cd54e5419584c0"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/deploy-contextual-language-search-once.yml"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run test:chat-editorial
      - run: npm run predeploy
      - run: npm run recovery:verify
      - run: node --test test/deploy-contract.test.cjs
      - run: npm run check

      - name: Deploy production
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify contextual search in production
        shell: bash
        run: |
          set -euo pipefail
          base="https://llmchatmls.dpidiaz.workers.dev"
          curl -LfsS "$base/js/app.js" -o /tmp/app.js
          grep -Fq "location.href='/virtuoso?lang=${slug}'" /tmp/app.js
          ! grep -Fq "location.hash='#search?lang=${slug}'" /tmp/app.js

          curl -LfsS "$base/virtuoso?lang=ingles" -o /tmp/virtuoso.html
          grep -Fq "new URLSearchParams(location.search).get('lang')" /tmp/virtuoso.html
          grep -Fq "language.value=requested" /tmp/virtuoso.html
          grep -Fq "requestAnimationFrame(()=>query.focus())" /tmp/virtuoso.html

          node - <<'NODE'
          const fs=require('fs');
          const vm=require('node:vm');
          const html=fs.readFileSync('/tmp/virtuoso.html','utf8');
          const pattern=/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi;
          const inline=[...html.matchAll(pattern)].map(m=>m[1].trim()).filter(Boolean);
          for(const [i,source] of inline.entries()) new vm.Script(source,{filename:'production-virtuoso-'+i+'.js'});
          console.log('CONTEXTUAL_LANGUAGE_SEARCH_PRODUCTION_OK');
          NODE
