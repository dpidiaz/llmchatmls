name: MLS Global Dispatcher Scheduler

on:
  issues:
    types:
      - opened
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: mls-global-dispatcher
  cancel-in-progress: false

jobs:
  scheduler:
    if: ${{ github.event_name != 'issues' || startsWith(github.event.issue.title, '[MLS Dispatcher]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ejecutar MLS Global Dispatcher
        run: node 'scripts/MLS global dispatcher scheduler.cjs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
