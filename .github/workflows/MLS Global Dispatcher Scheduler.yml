name: MLS Global Dispatcher Scheduler


on:
  workflow_dispatch:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  scheduler:
    concurrency:
      group: mls-global-dispatcher
      cancel-in-progress: false
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'issues' &&
           startsWith(github.event.issue.title, '[MLS Dispatcher]') &&
           contains(github.event.issue.body, '<!-- MLS_GLOBAL_DISPATCH_COMMAND') &&
           (github.event.issue.author_association == 'OWNER' ||
            github.event.issue.author_association == 'MEMBER' ||
            github.event.issue.author_association == 'COLLABORATOR' ||
            github.event.issue.user.login == 'github-actions[bot]')) }}
    runs-on: ubuntu-latest
    env:
      MLS_GITHUB_COOLDOWN_FILE: .mls-github-cooldown.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.MLS_GITHUB_COOLDOWN_FILE }}
          key: mls-github-cooldown-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mls-github-cooldown-
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ejecutar MLS Global Dispatcher
        run: node 'scripts/MLS global dispatcher scheduler.cjs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve GitHub cooldown after interruption
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MLS_GITHUB_COOLDOWN_FILE }}
          key: mls-github-cooldown-${{ github.run_id }}-${{ github.run_attempt }}

