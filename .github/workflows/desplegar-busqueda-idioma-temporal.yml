name: Desplegar búsqueda idioma primero temporal

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desplegar-busqueda-idioma-temporal.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Suite completa
        run: npm run test:chat-editorial
      - name: Construir MLS
        run: npm run predeploy
      - name: Dry run Cloudflare
        run: npm run check
      - name: Desplegar búsqueda idioma primero
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verificar búsqueda en producción
        shell: bash
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'
          for i in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error "$base/js/search.js" -o search.js; then break; fi
            sleep 3
          done
          grep -q 'MLS SEARCH LANGUAGE FIRST 1.0' search.js
          grep -q 'search-language-primary' search.js
          grep -q 'Selecciona un idioma para buscar.' search.js
          grep -q 'option value="all"' search.js
          grep -q "rawLang==='all'?'':rawLang" search.js
          if grep -q '<option value="">Todos los idiomas</option>' search.js; then
            echo "::error::Todos los idiomas sigue siendo el estado vacío por defecto"
            exit 1
          fi
          echo 'language-first search verified'
