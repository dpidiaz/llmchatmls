name: Deploy Virtuoso degraded copy hotfix once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-virtuoso-degraded-copy-once.yml"

permissions:
  contents: read

jobs:
  verify-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify intended hotfix parent
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "e6f2796c1d5d13c0b47a81fe014043e3f2f603e2"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/deploy-virtuoso-degraded-copy-once.yml"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run test:chat-editorial
      - run: npm run predeploy
      - run: npm run recovery:verify
      - run: node --test test/deploy-contract.test.cjs
      - run: npm run check

      - name: Deploy production
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify Virtuoso production
        shell: bash
        run: |
          set -euo pipefail
          base="https://llmchatmls.dpidiaz.workers.dev"
          curl -LfsS "$base/virtuoso" -o /tmp/virtuoso.html
          count="$(grep -o 'Virtuoso no está disponible temporalmente' /tmp/virtuoso.html | wc -l | tr -d ' ')"
          test "$count" = "1"
          node - <<'NODE'
          const fs=require('fs');
          const vm=require('node:vm');
          const html=fs.readFileSync('/tmp/virtuoso.html','utf8');
          const pattern=/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi;
          const inline=[...html.matchAll(pattern)].map(m=>m[1].trim()).filter(Boolean);
          for(const [i,source] of inline.entries()) new vm.Script(source,{filename:'production-virtuoso-'+i+'.js'});
          console.log('VIRTUOSO_DEGRADED_COPY_OK');
          NODE
