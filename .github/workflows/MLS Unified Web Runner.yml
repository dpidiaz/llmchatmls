name: MLS Unified Web Runner

on:
  workflow_dispatch:
    inputs:
      target_entries:
        description: Chat-scoped cumulative target (100-1000, multiple of 5)
        required: false
        default: '1000'
        type: string
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - MLS Global Dispatcher Scheduler
      - MLS Unified R33 Evidence Submit
      - MLS Unified R33 Evidence Batch Submit
      - MLS Unified R33 Integration Execute
    types:
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: mls-unified-github-writer
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover legacy R44 quarantine
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
          MLS_UNIFIED_BASE_URL: https://llmchatmls.dpidiaz.workers.dev
          R44_LEGACY_RECONCILE_BATCH: 50
          R44_LEGACY_RECONCILE_MAX_BATCHES: 4
          R44_LEGACY_RECONCILE_ENFORCE_D1_FREE_GUARD: '0'
        run: node 'scripts/r44 legacy quarantine reconcile.cjs'

      - name: Advance canonical MLS Unified lanes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
          MLS_UNIFIED_BASE_URL: https://llmchatmls.dpidiaz.workers.dev
          MLS_UNIFIED_TARGET_ENTRIES: ${{ inputs.target_entries || '1000' }}
          MLS_UNIFIED_R33_FANOUT: '64'
          MLS_UNIFIED_R33_MAX_BATCH: '50'
        run: node 'scripts/MLS unified web runner.cjs'
