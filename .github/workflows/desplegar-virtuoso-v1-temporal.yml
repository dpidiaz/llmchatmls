name: Desplegar Virtuoso V1 una vez

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desplegar-virtuoso-v1-temporal.yml"

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Suite Virtuoso y MLS
        run: npm run test:chat-editorial
      - name: Construir MLS con Virtuoso
        run: npm run predeploy
      - name: Verificar contrato
        run: node --test test/deploy-contract.test.cjs
      - name: Dry run Cloudflare
        run: npm run check
      - name: Desplegar Virtuoso V1
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verificar Virtuoso en producción
        shell: bash
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'

          fetch_retry() {
            local url="$1"; local out="$2"
            for i in 1 2 3 4 5 6 7 8; do
              if curl --fail --silent --show-error "$url" -o "$out"; then return 0; fi
              sleep 3
            done
            return 1
          }

          fetch_retry "$base/virtuoso" virtuoso.html
          grep -q '<title>Virtuoso · Bibliotecario de MASTER LANGUAGE SYSTEM</title>' virtuoso.html
          grep -q '/api/virtuoso' virtuoso.html
          grep -q '/api/search/embedding' virtuoso.html
          grep -q '/data/semantic/manifest.json' virtuoso.html
          echo 'VIRTUOSO_PAGE_OK'

          fetch_retry "$base/" home.html
          grep -q 'href="/virtuoso"' home.html
          echo 'VIRTUOSO_NAV_OK'

          cat > request.json <<'JSON'
          {
            "query":"Quiero hablar de acciones que se repiten desde hace tiempo",
            "targetLanguage":"portugues",
            "candidates":[
              {"code":"MLS-V02-0964","semanticScore":0.564},
              {"code":"MLS-V02-0492","semanticScore":0.558},
              {"code":"MLS-V02-0490","semanticScore":0.546},
              {"code":"MLS-V02-0489","semanticScore":0.538},
              {"code":"MLS-V02-0488","semanticScore":0.532},
              {"code":"MLS-V02-0613","semanticScore":0.531},
              {"code":"MLS-V02-0907","semanticScore":0.528},
              {"code":"MLS-V02-0491","semanticScore":0.528}
            ]
          }
          JSON

          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}'             -X POST "$base/api/virtuoso" -H 'content-type: application/json' --data-binary @request.json)
          if [ "$status" != "200" ]; then
            echo "::error::Virtuoso devolvió HTTP $status"
            cat response.json || true
            exit 1
          fi
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('response.json','utf8'));
          const allowed=new Set(['MLS-V02-0964','MLS-V02-0492','MLS-V02-0490','MLS-V02-0489','MLS-V02-0488','MLS-V02-0613','MLS-V02-0907','MLS-V02-0491']);
          if(!p.ok)throw new Error('Virtuoso no devolvió ok');
          if(!Array.isArray(p.recommendations)||p.recommendations.length<1||p.recommendations.length>5)throw new Error('Cantidad de recomendaciones inválida');
          for(const r of p.recommendations){
            if(!allowed.has(r.code))throw new Error('Virtuoso inventó o salió de candidatos: '+r.code);
            if(!String(r.title||'').trim())throw new Error('Título canónico vacío');
            if(r.deepLink!=='/#entry='+r.code)throw new Error('Deep link inválido: '+r.deepLink);
          }
          console.log('VIRTUOSO_CANONICAL_OK '+JSON.stringify({usedAi:p.usedAi,degraded:p.degraded,count:p.recommendations.length,codes:p.recommendations.map(r=>r.code)}));
          NODE

          cat > invalid.json <<'JSON'
          {"query":"pasado","targetLanguage":"portugues","candidates":[{"code":"MLS-V01-0001"}]}
          JSON
          invalid_status=$(curl --silent --show-error --output invalid-response.json --write-out '%{http_code}'             -X POST "$base/api/virtuoso" -H 'content-type: application/json' --data-binary @invalid.json)
          if [ "$invalid_status" != "400" ]; then
            echo "::error::Virtuoso aceptó candidato de otro idioma: HTTP $invalid_status"
            cat invalid-response.json || true
            exit 1
          fi
          echo 'VIRTUOSO_LANGUAGE_GUARD_OK'
          echo 'VIRTUOSO_V1_END_TO_END_OK'
