name: Inspect translator integration points once

on:
  push:
    branches:
      - feature/translator-pronunciation-offline
    paths:
      - ".github/workflows/inspect-translator-integration-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run predeploy
      - name: Print generated integration points
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const home=fs.readFileSync('public/index.html','utf8');
          const app=fs.readFileSync('public/js/app.js','utf8');
          for(const [name,s] of [['home',home],['app',app]]){
            for(const term of ['<summary>Herramientas</summary>','Guardados','Configuración','Explora por idioma','Buscar aquí']){
              const i=s.indexOf(term);
              if(i>=0){
                console.log('--- '+name+' :: '+term+' ---');
                console.log(s.slice(Math.max(0,i-1800),Math.min(s.length,i+4200)));
              }
            }
          }
          NODE
