name: R33 GitHub Native Tests

on:
  push:
    branches:
      - main
      - r33-github-native
    paths:
      - 'MLS R32 EDITORIAL/evidence git.js'
      - 'MLS R32 EDITORIAL/evidence git/**'
      - 'MLS R32 EDITORIAL/evidence farm core.js'
      - 'MLS R32 EDITORIAL/R33 Evidence Farm Protocol R2.md'
      - 'MLS R32 EDITORIAL/global dispatcher/providers/integration.js'
      - 'MLS R32 EDITORIAL/global dispatcher/integration.js'
      - 'MLS R32 EDITORIAL/global dispatcher/work registry.json'
      - 'scripts/R33 evidence **'
      - 'scripts/R33 gate500 control.cjs'
      - 'scripts/MLS global dispatcher worker.cjs'
      - 'scripts/generar evidence runtime github.js'
      - 'scripts/habilitar evidence lector.js'
      - 'MLS R32 OVERLAY/reader.js'
      - 'test/r33 evidence **'
      - 'test/r33 gate500 preparation.test.cjs'
      - 'test/mls global dispatcher integration.test.cjs'
      - 'test/mls global dispatcher providers integration.test.cjs'
      - 'test/evidence github runtime.test.cjs'
      - 'test/evidence reader integration.test.cjs'
      - 'test/evidence native reader.test.cjs'
      - 'docs/evidence y provenance/15 Evidence Farm Correction Repeat Pool.json'
      - 'docs/evidence y provenance/20 R33 Gate 500 Pool.json'
      - 'docs/evidence y provenance/21 R33 Active Pool Control.json'
      - 'package.json'
      - '.github/workflows/R33 **'
  pull_request:
    paths:
      - 'MLS R32 EDITORIAL/evidence git.js'
      - 'MLS R32 EDITORIAL/evidence git/**'
      - 'MLS R32 EDITORIAL/evidence farm core.js'
      - 'MLS R32 EDITORIAL/R33 Evidence Farm Protocol R2.md'
      - 'MLS R32 EDITORIAL/global dispatcher/providers/integration.js'
      - 'MLS R32 EDITORIAL/global dispatcher/integration.js'
      - 'MLS R32 EDITORIAL/global dispatcher/work registry.json'
      - 'scripts/R33 evidence **'
      - 'scripts/R33 gate500 control.cjs'
      - 'scripts/MLS global dispatcher worker.cjs'
      - 'test/r33 evidence **'
      - 'test/r33 gate500 preparation.test.cjs'
      - 'test/mls global dispatcher integration.test.cjs'
      - 'test/mls global dispatcher providers integration.test.cjs'
      - 'docs/evidence y provenance/20 R33 Gate 500 Pool.json'
      - 'docs/evidence y provenance/21 R33 Active Pool Control.json'
      - 'package.json'
      - '.github/workflows/R33 **'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Certificar R33 GitHub-native
        run: npm run test:r33-github-native
