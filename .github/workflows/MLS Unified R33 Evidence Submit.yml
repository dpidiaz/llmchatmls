name: MLS Unified R33 Evidence Submit

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Canonical Dispatcher assignment issue
        required: true
        type: string
      comment_id:
        description: Auditable Evidence submission comment
        required: true
        type: string
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  submit:
    concurrency:
      group: mls-unified-github-writer
      cancel-in-progress: false
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (startsWith(github.event.issue.title, '[MLS Dispatcher][LEASED]') &&
          contains(github.event.comment.body, 'MLS_UNIFIED_R33_EVIDENCE_SUBMIT') &&
          (github.event.comment.author_association == 'OWNER' ||
           github.event.comment.author_association == 'MEMBER' ||
           github.event.comment.author_association == 'COLLABORATOR' ||
           github.event.comment.user.login == 'github-actions[bot]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check durable secondary writer cooldown
        id: sink_guard
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
        run: |
          cp 'scripts/r44 sink guard.cjs' "$RUNNER_TEMP/mls-sink-guard.cjs"
          node "$RUNNER_TEMP/mls-sink-guard.cjs" check
      - name: Validate authorized Unified Evidence submission
        id: prep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MLS_UNIFIED_ISSUE_NUMBER: ${{ github.event.inputs.issue_number || '' }}
          MLS_UNIFIED_COMMENT_ID: ${{ github.event.inputs.comment_id || '' }}
        shell: bash
        run: |
          cp 'scripts/MLS unified r33 evidence submit.cjs' "$RUNNER_TEMP/mls-unified-r33-evidence-submit.cjs"
          node "$RUNNER_TEMP/mls-unified-r33-evidence-submit.cjs" prepare
      - name: Checkout exact assignment branch
        env:
          BRANCH: ${{ steps.prep.outputs.branch }}
        shell: bash
        run: |
          git fetch --no-tags origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout -B unified-evidence-submit "refs/remotes/origin/$BRANCH"
      - name: Apply draft and run canonical preflight before commit
        id: stage
        env:
          EVIDENCE_PATH: ${{ steps.prep.outputs.evidence_path }}
          CONTENT_PATH: ${{ steps.prep.outputs.content_path }}
          BUNDLE_PATH: ${{ steps.prep.outputs.bundle_path }}
        shell: bash
        run: |
          node "$RUNNER_TEMP/mls-unified-r33-evidence-submit.cjs" apply "$BUNDLE_PATH"
          node scripts/R4-evidence-preflight.cjs "$EVIDENCE_PATH"
          git add -- "$EVIDENCE_PATH" "$CONTENT_PATH" 'MLS R32 EDITORIAL/evidence git/registry/sources'
          mapfile -t staged < <(git diff --cached --name-only)
          bad=()
          for file in "${staged[@]}"; do
            if [ "$file" != "$EVIDENCE_PATH" ] && [ "$file" != "$CONTENT_PATH" ] && [[ "$file" != "MLS R32 EDITORIAL/evidence git/registry/sources/"MLS-SRC-*.json ]]; then
              bad+=("$file")
            fi
          done
          if [ "${#bad[@]}" -gt 0 ]; then
            printf 'Unexpected staged paths: %s\n' "${bad[*]}" >&2
            exit 1
          fi
          if [ "${#staged[@]}" -eq 0 ]; then
            echo "no_change=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_change=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit preflighted Evidence
        id: commit
        env:
          CODE: ${{ steps.prep.outputs.code }}
          NO_CHANGE: ${{ steps.stage.outputs.no_change }}
        shell: bash
        run: |
          if [ "$NO_CHANGE" != "true" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "r33(unified): verify $CODE"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate committed R33 Evidence
        shell: bash
        run: |
          node --test 'test/r33 evidence editorial batch.test.cjs' 'test/r33 evidence farm.test.cjs'
      - name: Publish validated assignment commit
        env:
          BRANCH: ${{ steps.prep.outputs.branch }}
        shell: bash
        run: |
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "MLS_UNIFIED_R33_EVIDENCE_COMMIT ${{ steps.commit.outputs.sha }}"
      - name: Prepare fenced durable checkpoint event
        id: checkpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_PATH: ${{ steps.prep.outputs.bundle_path }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          node "$RUNNER_TEMP/mls-unified-r33-evidence-submit.cjs" checkpoint-event "$BUNDLE_PATH" "$COMMIT_SHA" "$GITHUB_RUN_ID"
      - name: Apply checkpoint through canonical Worker Events handler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNTHETIC_EVENT_PATH: ${{ steps.checkpoint.outputs.event_path }}
        shell: bash
        run: |
          git fetch --no-tags origin main
          git checkout --detach origin/main
          GITHUB_EVENT_PATH="$SYNTHETIC_EVENT_PATH" node 'scripts/MLS global dispatcher worker.cjs'
      - name: Prepare finish event when microclaim is complete
        id: finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_PATH: ${{ steps.prep.outputs.bundle_path }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          node 'scripts/MLS unified r33 evidence submit.cjs' finish-event "$BUNDLE_PATH" "$COMMIT_SHA" "$GITHUB_RUN_ID"
      - name: Finish completed Unified microclaim through canonical handler
        if: ${{ steps.finish.outputs.finish_needed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNTHETIC_EVENT_PATH: ${{ steps.finish.outputs.event_path }}
        shell: bash
        run: GITHUB_EVENT_PATH="$SYNTHETIC_EVENT_PATH" node 'scripts/MLS global dispatcher worker.cjs'
      - name: Continue Unified Web Runner
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh workflow run 'MLS Unified Web Runner.yml' --ref main

      - name: Preserve durable retry after writer failure
        if: ${{ failure() && steps.sink_guard.outcome == 'success' }}
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
        run: node "$RUNNER_TEMP/mls-sink-guard.cjs" degrade
