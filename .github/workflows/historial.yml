name: Inspeccionar historial AUTOOPT

on:
  workflow_dispatch:
    inputs:
      database:
        description: Nombre real de la base D1; déjalo vacío para listarlas
        required: false
        type: string
      before:
        description: Corte UTC ISO para la simulación, por ejemplo 2026-09-15T00:00:00.000Z
        required: false
        type: string
      batch:
        description: Identificador del lote histórico
        required: false
        type: string

permissions:
  contents: read

jobs:
  discover:
    if: ${{ inputs.database == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 list --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  cutoff:
    if: ${{ inputs.database != '' && inputs.before == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 execute "${{ inputs.database }}" --remote --command "SELECT MIN(created_at) AS first_live_event FROM wiki_autoopt_events" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  preview:
    if: ${{ inputs.database != '' && inputs.before != '' && inputs.batch != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node 'scripts/autoopt history.cjs' preview --database "${{ inputs.database }}" --remote --before "${{ inputs.before }}" --batch "${{ inputs.batch }}" --out 'AUTOOPT historial.json'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: autoopt-historical-preview
          path: AUTOOPT historial.json
