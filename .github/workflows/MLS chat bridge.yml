name: MLS Chat Bridge

on:
  push:
    branches:
      - mlschatcontrol
    paths:
      - 'mls chat bridge/commands/**/*.json'

permissions:
  contents: write

concurrency:
  group: mls-chat-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ejecutar comandos MLS Chat Bridge
        shell: bash
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
        run: |
          set -euo pipefail
          queue_file="$RUNNER_TEMP/mls-chat-bridge-pending.txt"
          : > "$queue_file"
          while IFS= read -r command_file; do
            rel="${command_file#mls chat bridge/commands/}"
            result_file="mls chat bridge/results/$rel"
            if [ ! -f "$result_file" ]; then
              printf '%s\n' "$command_file" >> "$queue_file"
            fi
          done < <(find 'mls chat bridge/commands' -type f -name '*.json' -print | LC_ALL=C sort)
          mapfile -t files < "$queue_file"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No hay comandos MLS Chat Bridge pendientes."
            exit 0
          fi
          printf 'Procesando %s comando(s) pendiente(s).\n' "${#files[@]}"
          node 'scripts/MLS chat bridge.cjs' "${files[@]}"

      - name: Guardar resultados del puente
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- 'mls chat bridge/results')" ]; then
            echo "No hay resultados nuevos."
            exit 0
          fi
          git config user.name 'MLS Chat Bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add 'mls chat bridge/results'
          git commit -m "Guardar resultado MLS Chat Bridge"
          git fetch origin mlschatcontrol
          git rebase origin/mlschatcontrol
          git push origin HEAD:mlschatcontrol

      - name: Verificar respuestas MLS Chat Bridge
        shell: bash
        run: |
          set -euo pipefail
          queue_file="$RUNNER_TEMP/mls-chat-bridge-pending.txt"
          if [ ! -s "$queue_file" ]; then
            exit 0
          fi
          mapfile -t files < "$queue_file"
          node 'scripts/MLS chat bridge.cjs' --verify "${files[@]}"
