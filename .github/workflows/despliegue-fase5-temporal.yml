name: Verificar Fase 5 MLS temporal

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/despliegue-fase5-temporal.yml"

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar producción R32-only sin legacy
        shell: bash
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'

          fetch_retry() {
            local url="$1"
            local out="$2"
            for i in 1 2 3 4 5 6 7 8; do
              if curl --fail --silent --show-error "$url" -o "$out"; then return 0; fi
              if [ "$i" -lt 8 ]; then sleep 3; fi
            done
            return 1
          }

          fetch_retry "$base/data/canonical/compat-health.json" compat.json
          node -e "const h=require('./compat.json');if(h.ok!==true||h.standard!=='MLS R32'||h.promptVersion!=='32.0'||Number(h.totalEntries)!==10133||h.legacyWikiSeedsPresent!==false||h.perEntryCanonicalSeedsPresent!==false||Number(h.editorialSeedCatalogs)!==10||Number(h.indexBytes)>=20*1024*1024)throw new Error('compat-health inválido '+JSON.stringify(h));console.log('compat-health OK',h.totalEntries,h.editorialSeedCatalogs,h.indexBytes)"

          fetch_retry "$base/data/canonical/editorial-seeds/chino-taiwan.json" editorial.json
          node -e "const c=require('./editorial.json'),s=c.entries&&c.entries['MLS-V07-0484'];if(c.standard!=='MLS R32'||c.promptVersion!=='32.0'||Number(c.totalEntries)!==1016||!s||s.title!=='不然')throw new Error('catálogo editorial inválido');console.log('editorial catalog OK',s.code,s.title)"

          for legacy in "$base/data/wiki-seeds/chino-taiwan/0484.json" "$base/data/canonical/seeds/chino-taiwan/0484.json"; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$legacy")
            if [ "$status" != "404" ]; then
              echo "::error::Ruta legacy/per-entry sigue publicada: $legacy (HTTP $status)"
              exit 1
            fi
          done
          echo 'legacy and per-entry seed routes removed'

          fetch_retry "$base/data/index.js" index.js
          grep -q 'window.MLS_META=' index.js
          grep -q 'MLS-V07-0484' index.js
          echo 'canonical compatibility index reachable'

          fetch_retry "$base/js/reader.js" reader.js
          grep -q '/data/canonical/runtime-manifest.json' reader.js
          ! grep -q '/api/wiki/article/' reader.js
          ! grep -q '/api/wiki/materialize/' reader.js
          echo 'reader remains GitHub-first'

          fetch_retry "$base/api/wiki/recent?limit=30" recent.json
          node -e "const rows=require('./recent.json');if(!Array.isArray(rows))throw new Error('recent no devolvió array');for(const r of rows)if(r.promptVersion!=='32.0')throw new Error('recent expuso '+JSON.stringify(r));console.log('wiki recent R32-only',rows.length)"

          status=$(curl --silent --show-error --output article.json --write-out '%{http_code}' "$base/api/wiki/article/MLS-V07-0484")
          if [ "$status" = "200" ]; then
            node -e "const p=require('./article.json'),a=p.article;if(!p.found||!a||a.promptVersion!=='32.0'||a.provider==='cloudflare-legacy'||a.auditProvider==='cloudflare-legacy')throw new Error('article API inválido '+JSON.stringify(p));console.log('wiki article R32-only',a.code,a.promptVersion)"
          elif [ "$status" = "404" ]; then
            echo 'wiki article absent from D1, no legacy fallback exposed'
          else
            echo "::error::wiki article devolvió HTTP $status"
            cat article.json || true
            exit 1
          fi
