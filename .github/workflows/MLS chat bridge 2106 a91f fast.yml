name: MLS Chat Bridge 2106 A91F Fast

on:
  push:
    branches:
      - r44-chat-2106-a91f-fast
    paths:
      - 'mls chat bridge/commands/r44-chat-2106-a91f/**/*.json'
      - '.github/workflows/MLS chat bridge 2106 a91f fast.yml'

permissions:
  contents: write

concurrency:
  group: mls-chat-bridge-2106-a91f-fast
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r44-chat-2106-a91f-fast
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ejecutar cola aislada 2106 A91F
        shell: bash
        env:
          MLS_EDITORIAL_CHAT_KEY: ${{ secrets.MLS_EDITORIAL_CHAT_KEY }}
        run: |
          set -euo pipefail
          git fetch origin r44-chat-2106-a91f-fast
          git reset --hard origin/r44-chat-2106-a91f-fast
          queue_file="$RUNNER_TEMP/mls-chat-bridge-2106-a91f-pending.txt"
          : > "$queue_file"
          while IFS= read -r command_file; do
            rel="${command_file#mls chat bridge/commands/}"
            result_file="mls chat bridge/results/$rel"
            if [ ! -f "$result_file" ]; then
              printf '%s\n' "$command_file" >> "$queue_file"
            fi
          done < <(find 'mls chat bridge/commands/r44-chat-2106-a91f' -type f -name '*.json' -print | LC_ALL=C sort)
          mapfile -t files < "$queue_file"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No hay comandos 2106 A91F pendientes."
            exit 0
          fi
          printf 'Procesando %s comando(s) 2106 A91F pendiente(s).\n' "${#files[@]}"
          node 'scripts/MLS chat bridge.cjs' "${files[@]}"

      - name: Guardar resultados 2106 A91F
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- 'mls chat bridge/results/r44-chat-2106-a91f')" ]; then
            echo "No hay resultados nuevos."
            exit 0
          fi
          git config user.name 'MLS Chat Bridge 2106 A91F'
          git config user.email 'actions@users.noreply.github.com'
          git add 'mls chat bridge/results/r44-chat-2106-a91f'
          git commit -m "Guardar resultado MLS Chat Bridge 2106 A91F"
          git push origin HEAD:r44-chat-2106-a91f-fast
