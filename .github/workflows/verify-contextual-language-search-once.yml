name: Verify contextual language search production once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-contextual-language-search-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify production contextual handoff
        shell: bash
        run: |
          node - <<'NODE'
          const base='https://llmchatmls.dpidiaz.workers.dev';
          const app=await fetch(base+'/js/app.js').then(async r=>{
            if(!r.ok)throw new Error('app.js HTTP '+r.status);
            return r.text();
          });
          if(!app.includes("location.href='/virtuoso?lang=")) throw new Error('contextual Virtuoso route missing');
          if(!app.includes('⌕ Buscar aquí')) throw new Error('Buscar aquí missing');
          if(app.includes("location.hash='#search?lang=")) throw new Error('legacy contextual hash still present');

          const res=await fetch(base+'/virtuoso?lang=ingles');
          if(!res.ok)throw new Error('Virtuoso HTTP '+res.status);
          const html=await res.text();
          if(!html.includes("new URLSearchParams(location.search).get('lang')")) throw new Error('lang query parsing missing');
          if(!html.includes('language.value=requested')) throw new Error('language preselection missing');
          if(!html.includes('requestAnimationFrame(()=>query.focus())')) throw new Error('query focus handoff missing');

          const vm=await import('node:vm');
          const pattern=/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi;
          const inline=[...html.matchAll(pattern)].map(m=>m[1].trim()).filter(Boolean);
          for(const [i,source] of inline.entries()) new vm.Script(source,{filename:'production-virtuoso-'+i+'.js'});
          console.log('CONTEXTUAL_LANGUAGE_SEARCH_PRODUCTION_OK');
          NODE
