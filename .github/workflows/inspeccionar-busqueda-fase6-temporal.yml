name: Inspeccionar búsqueda Fase 6 temporal

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspeccionar-busqueda-fase6-temporal.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar contratos del shell de búsqueda
        shell: bash
        run: |
          set -euo pipefail
          archive='MASTER LANGUAGE SYSTEM REVISION 32 BUNDLE.tar.gz'
          for file in public/js/search.js public/js/core.js public/index.html; do
            echo "===== $file ====="
            tar -xOzf "$archive" "$file" | head -c 24000
            echo
            echo "===== END $file ====="
          done

# trigger
