name: Diagnosticar MLS V07 0484 en bundle R32

on:
  push:
    branches:
      - main
    paths:
      - "scripts/diagnosticar entrada V07 0484.js"
      - ".github/workflows/diagnosticar-v07-0484.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Buscar entrada y vecinas dentro del bundle R32
        run: node "scripts/diagnosticar entrada V07 0484.js"
