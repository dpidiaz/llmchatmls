name: Inspect Bergamot registry format once

on:
  push:
    branches:
      - feature/translator-pronunciation-offline
    paths:
      - ".github/workflows/inspect-bergamot-registry-format-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect default registry and loader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bergamot-format
          cd /tmp/bergamot-format
          npm pack @browsermt/bergamot-translator@0.4.9 >/dev/null
          tar -xzf browsermt-bergamot-translator-0.4.9.tgz
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/bergamot-format/package/translator.js','utf8');
          for(const term of ['async loadTranslationModel','files[part]','file.url','file.name']){
            const i=s.indexOf(term);
            console.log('\n--- '+term+' ---\n');
            console.log(i>=0?s.slice(Math.max(0,i-1800),Math.min(s.length,i+7000)):'NOT FOUND');
          }
          NODE
          node --input-type=module - <<'NODE'
          const url='https://bergamot.s3.amazonaws.com/models/index.json';
          const registry=await fetch(url).then(r=>r.json());
          const keys=Object.keys(registry);
          console.log('OLD_REGISTRY_KEYS',keys.slice(0,20));
          for(const key of ['esen','pten','enja','jaen']){
            console.log('OLD_REGISTRY_SAMPLE',key,JSON.stringify(registry[key]||null,null,2));
          }
          NODE
