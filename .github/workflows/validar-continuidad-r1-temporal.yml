name: Validar continuidad R1 temporal

on:
  push:
    branches:
      - uxui-r1-continuity
    paths:
      - ".github/workflows/validar-continuidad-r1-temporal.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test completo
        run: npm run test:chat-editorial
      - name: Accessibility baseline de G
        run: npm run qa:baseline
      - name: Predeploy
        run: npm run predeploy
      - name: Recovery
        run: npm run recovery:verify
      - name: Dry run
        run: npm run check
