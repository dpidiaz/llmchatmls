name: Desplegar UX Buscar a Virtuoso una vez

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desplegar-buscar-virtuoso-temporal.yml"

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:chat-editorial
      - run: npm run predeploy
      - run: npm run recovery:verify
      - run: npm run check
      - name: Desplegar
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verificar Buscar y Virtuoso en producción
        shell: bash
        run: |
          set -euo pipefail
          base='https://llmchatmls.dpidiaz.workers.dev'
          for i in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error "$base/" -o home.html &&
               curl --fail --silent --show-error "$base/virtuoso" -o virtuoso.html; then
              break
            fi
            sleep 3
          done
          node - <<'NODE'
          const fs=require('node:fs');
          const home=fs.readFileSync('home.html','utf8');
          const virtuoso=fs.readFileSync('virtuoso.html','utf8');
          const anchors=[...home.matchAll(/<a\b[^>]*href=(["'])\/virtuoso\1[^>]*>[\s\S]*?<\/a>/gi)].map(m=>m[0]);
          const buscar=anchors.filter(a=>/Buscar/i.test(a));
          if(buscar.length<3)throw new Error('Se esperaban al menos 3 accesos Buscar → /virtuoso; encontrados '+buscar.length);
          if(/href=(["'])#search[^"']*\1/i.test(home))throw new Error('Sobrevive un href #search en el home');
          if(anchors.some(a=>/>\s*Virtuoso\s*<\/a>/i.test(a)))throw new Error('Sobrevive un botón separado Virtuoso en el home');
          if(!/<title>Virtuoso · Bibliotecario de MASTER LANGUAGE SYSTEM<\/title>/.test(virtuoso))throw new Error('La página Virtuoso perdió su identidad');
          if(!/<h1>Virtuoso<\/h1>/.test(virtuoso))throw new Error('La página Virtuoso perdió su nombre');
          if(!/Consultar a Virtuoso/.test(virtuoso))throw new Error('La página Virtuoso perdió su personalidad');
          console.log('BUSCAR_VIRTUOSO_UX_OK '+JSON.stringify({buscarLinks:buscar.length,separateVirtuosoNav:false,virtuosoPersona:true}));
          NODE
